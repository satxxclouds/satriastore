<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>LUVIELLE — STORE</title>

  <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
  <meta name="theme-color" content="#FFFDF5">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    :root {
      --bg: #FFFDF5;
      --ink: #000000;
      --accent: #FF6B6B;
      --accent-hover: #FF5252;
      --secondary: #FFD93D;
      --muted: #C4B5FD;
      --white: #FFFFFF;

      --border-w: 4px;
      --border: 4px solid #000;
      --shadow-sm: 4px 4px 0 0 #000;
      --shadow-md: 6px 6px 0 0 #000;
      --shadow-lg: 8px 8px 0 0 #000;
      --shadow-xl: 12px 12px 0 0 #000;

      --font-sans: 'Space Grotesk', system-ui, sans-serif;
      --font-display: 'Archivo Black', 'Space Grotesk', sans-serif;

      --snap: cubic-bezier(.2, .9, .3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* ==========================================================
       BODY — ANIMATED MESH GRADIENT BACKGROUND
       ========================================================== */
    body {
      font-family: var(--font-sans);
      font-weight: 700;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 20%, rgba(255,107,107,.30), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(196,181,253,.35), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255,217,61,.25), transparent 45%),
        radial-gradient(circle at 5% 95%, rgba(107,224,255,.25), transparent 35%),
        radial-gradient(circle at 95% 10%, rgba(255,193,7,.22), transparent 30%);
      background-size: 180% 180%;
      background-position: 0% 0%;
      animation: meshShift 24s ease-in-out infinite;
      min-height: 100vh;
      padding: 0 0 32px;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      position: relative;
    }

    @keyframes meshShift {
      0%, 100% { background-position: 0% 0%; }
      25%      { background-position: 100% 0%; }
      50%      { background-position: 100% 100%; }
      75%      { background-position: 0% 100%; }
    }

    /* ==========================================================
       ANIMATED GRID PATTERN (panning)
       ========================================================== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(to right, rgba(0,0,0,.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,.07) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridPan 60s linear infinite;
    }

    @keyframes gridPan {
      from { background-position: 0 0, 0 0; }
      to   { background-position: 40px 40px, 40px 40px; }
    }

    /* ==========================================================
       PULSING HALFTONE — BOTTOM LEFT
       ========================================================== */
    body::after {
      content: '';
      position: fixed;
      bottom: -40px;
      left: -40px;
      width: 320px;
      height: 320px;
      background-image: radial-gradient(var(--accent) 2px, transparent 2.5px);
      background-size: 20px 20px;
      opacity: .15;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(circle at bottom left, #000 25%, transparent 70%);
      -webkit-mask-image: radial-gradient(circle at bottom left, #000 25%, transparent 70%);
      animation: halftonePulse 8s ease-in-out infinite;
    }

    @keyframes halftonePulse {
      0%, 100% { opacity: .15; transform: scale(1) rotate(0deg); }
      50%      { opacity: .28; transform: scale(1.06) rotate(3deg); }
    }

    /* ==========================================================
       FLOATING GEOMETRIC SHAPES
       ========================================================== */
    .bg-shapes {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-shape {
      position: absolute;
      border: 3px solid rgba(0,0,0,.08);
      animation: floatShape 20s ease-in-out infinite;
      will-change: transform;
    }

    .bg-shape-1 {
      top: 8%; left: 5%;
      width: 140px; height: 140px;
      border-radius: 50%;
      border-color: rgba(255,107,107,.22);
      animation-delay: 0s;
    }
    .bg-shape-2 {
      top: 55%; right: 6%;
      width: 180px; height: 180px;
      border-color: rgba(196,181,253,.28);
      animation-delay: -4s;
    }
    .bg-shape-3 {
      bottom: 8%; left: 15%;
      width: 100px; height: 100px;
      border-radius: 50%;
      border-color: rgba(255,217,61,.32);
      animation-delay: -8s;
    }
    .bg-shape-4 {
      top: 25%; right: 30%;
      width: 60px; height: 60px;
      border-color: rgba(0,0,0,.07);
      animation-delay: -12s;
    }
    .bg-shape-5 {
      bottom: 30%; right: 20%;
      width: 80px; height: 80px;
      border-radius: 50%;
      border-color: rgba(255,107,107,.18);
      animation-delay: -6s;
    }

    @keyframes floatShape {
      0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      25%      { transform: translate(40px, -30px) rotate(90deg) scale(1.05); }
      50%      { transform: translate(-20px, 40px) rotate(180deg) scale(.95); }
      75%      { transform: translate(30px, 20px) rotate(270deg) scale(1.02); }
    }

    /* ==========================================================
       DECO LAYER (stars & squares)
       ========================================================== */
    .deco-layer { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .deco-star { position: absolute; fill: currentColor; animation: spin 14s linear infinite; }
    .star-1 { top: 16%; right: 5%; width: 34px; color: var(--accent); }
    .star-2 { bottom: 20%; left: 4%; width: 26px; color: var(--secondary); animation-duration: 18s; animation-direction: reverse; }
    .star-3 { top: 55%; right: 3%; width: 20px; color: var(--muted); animation-duration: 22s; }

    .deco-square {
      position: absolute;
      border: 3px solid #000;
      animation: bob 4.5s ease-in-out infinite;
    }
    .square-1 { top: 32%; left: 3%; width: 18px; height: 18px; background: var(--secondary); }
    .square-2 { bottom: 30%; right: 4%; width: 22px; height: 22px; background: var(--muted); animation-delay: 1.2s; animation-direction: reverse; }
    .square-3 { top: 78%; left: 6%; width: 14px; height: 14px; background: var(--accent); animation-delay: .5s; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0); }
      50%      { transform: translateY(-8px) rotate(6deg); }
    }

    /* ==========================================================
       APP
       ========================================================== */
    .app {
      width: 100%;
      max-width: 620px;
      padding: 12px 16px 0;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ===== Top bar ===== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      flex: 0 0 auto;
      animation: popIn .35s var(--snap) both;
    }

    .clock-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--secondary);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 9px 16px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .2em;
      color: #000;
      text-transform: uppercase;
      animation: clockFloat 5s ease-in-out infinite;
    }
    .clock-chip .led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #000;
      animation: blink 1.4s steps(2) infinite;
    }
    @keyframes blink {
      0%, 50%  { opacity: 1; }
      51%, 100% { opacity: .25; }
    }
    @keyframes clockFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-2px); }
    }

    .avatar-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 20px;
      color: #000;
      cursor: pointer;
      transition: transform .1s ease-out, box-shadow .1s ease-out;
      animation: avatarRing 3s ease-in-out infinite;
    }
    @keyframes avatarRing {
      0%, 100% { box-shadow: var(--shadow-sm), 0 0 0 0 rgba(255,107,107,.5); }
      50%      { box-shadow: var(--shadow-sm), 0 0 0 10px rgba(255,107,107,0); }
    }
    .avatar-btn:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-md); }
    .avatar-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 0 #000; }

    /* ===== Hero title ===== */
    .hero-text-top {
      text-align: center;
      margin: 8px 0 20px;
      flex: 0 0 auto;
      animation: popIn .4s var(--snap) both;
    }

    .store-heading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .store-name {
      display: inline-block;
      font-family: var(--font-display);
      font-size: clamp(38px, 12vw, 84px);
      line-height: 1;
      letter-spacing: -.035em;
      text-transform: uppercase;
      color: #000;
      background: var(--secondary);
      border: var(--border);
      padding: 8px 20px 4px;
      box-shadow: var(--shadow-lg);
      transform: rotate(-2deg);
      animation: storeFloat 5s ease-in-out infinite;
      max-width: 100%;
      word-break: break-word;
    }
    @keyframes storeFloat {
      0%, 100% { transform: rotate(-2deg) translateY(0); box-shadow: var(--shadow-lg); }
      50%      { transform: rotate(-2.5deg) translateY(-4px); box-shadow: 9px 9px 0 0 #000; }
    }

    .store-sub {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      max-width: 320px;
    }

    .deco-line { flex: 0 1 60px; height: 4px; background: #000; }

    .store-label {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border: var(--border);
      padding: 6px 14px 4px;
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: .3em;
      text-transform: uppercase;
      box-shadow: var(--shadow-sm);
      transform: rotate(2deg);
      animation: labelPulse 3s ease-in-out infinite;
    }
    @keyframes labelPulse {
      0%, 100% { transform: rotate(2deg) scale(1); }
      50%      { transform: rotate(2deg) scale(1.05); }
    }

    /* ===== Video ===== */
    .video-wrap {
      position: relative;
      margin-bottom: 18px;
      flex: 0 0 auto;
    }

    .video-card {
      position: relative;
      width: 100%;
      background: #000;
      border: var(--border);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transform: rotate(-1deg);
      transition: transform .15s ease-out, box-shadow .15s ease-out;
      will-change: transform;
    }
    .video-card:hover {
      transform: rotate(-1deg) translate(-2px, -2px);
      box-shadow: var(--shadow-xl);
    }
    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      background: #000;
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .video-card-mobile { display: block; aspect-ratio: 16 / 9; }
    .video-card-desktop { display: none; }

    .hero-text-bottom {
      margin: 4px 0 20px;
      flex: 0 0 auto;
      animation: popIn .4s .1s var(--snap) both;
    }
    .hero-text-bottom p {
      font-size: 14px;
      font-weight: 700;
      color: #000;
      line-height: 1.4;
      letter-spacing: -.005em;
      text-align: center;
    }

    /* ===== Menu ===== */
    .menu-wrap {
      position: relative;
      padding-top: 74px;
      flex: 0 0 auto;
      animation: popIn .4s .15s var(--snap) both;
    }

    .menu-wrap::before {
      content: 'EXPLORE';
      position: absolute;
      top: 0;
      left: 4px;
      background: #000;
      color: #fff;
      padding: 5px 12px 3px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: .35em;
      box-shadow: 4px 4px 0 0 var(--secondary);
      transform: rotate(-1deg);
    }

    .menu-wrap::after {
      content: 'MENU';
      position: absolute;
      top: 30px;
      left: 2px;
      font-family: var(--font-display);
      font-size: 38px;
      line-height: 1;
      letter-spacing: -.03em;
      color: #000;
      text-shadow: 4px 4px 0 var(--accent);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 13px;
    }

    /* ===== Menu item ===== */
    .menu-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 18px 20px;
      min-height: 92px;
      background: var(--secondary);
      border: var(--border);
      box-shadow: var(--shadow-md);
      text-decoration: none;
      color: #000;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition:
        transform .12s ease-out,
        box-shadow .12s ease-out,
        background-color .12s ease-out;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      animation: popIn .35s var(--snap) both;
      will-change: transform;
    }
    .menu-item * {
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .menu-item::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        105deg,
        transparent 35%,
        rgba(255,255,255,.55) 50%,
        transparent 65%
      );
      transform: translateX(-130%);
      pointer-events: none;
      animation: shineSweep 7s ease-in-out infinite;
    }

    @keyframes shineSweep {
      0%, 55%, 100% { transform: translateX(-130%); }
      25%           { transform: translateX(130%); }
    }

    .menu-item:nth-child(1)::after { animation-delay: 0s; }
    .menu-item:nth-child(2)::after { animation-delay: .6s; }
    .menu-item:nth-child(3)::after { animation-delay: 1.2s; }
    .menu-item:nth-child(4)::after { animation-delay: 1.8s; }
    .menu-item:nth-child(5)::after { animation-delay: 2.4s; }
    .menu-item:nth-child(6)::after { animation-delay: 3.0s; }
    .menu-item:nth-child(7)::after { animation-delay: 3.6s; }
    .menu-item:nth-child(8)::after { animation-delay: 4.2s; }

    .menu-item:nth-child(1) { animation-delay: .04s; }
    .menu-item:nth-child(2) { animation-delay: .08s; }
    .menu-item:nth-child(3) { animation-delay: .12s; }
    .menu-item:nth-child(4) { animation-delay: .16s; }
    .menu-item:nth-child(5) { animation-delay: .20s; }
    .menu-item:nth-child(6) { animation-delay: .24s; }
    .menu-item:nth-child(7) { animation-delay: .28s; }
    .menu-item:nth-child(8) { animation-delay: .32s; }

    .menu-item:hover {
      transform: translate(-2px, -2px);
      box-shadow: 9px 9px 0 0 #000;
    }
    .menu-item:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 0 #000;
      transition-duration: .05s;
    }

    .menu-item .icon {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      flex-shrink: 0;
      transition: transform .12s ease-out;
    }
    .menu-item .icon i { font-size: 19px; line-height: 1; }

    .menu-item .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .menu-item .name {
      font-family: var(--font-display);
      font-size: 17px;
      line-height: 1.12;
      letter-spacing: -.01em;
      text-transform: uppercase;
      color: #000;
      word-break: break-word;
    }
    .menu-item .desc {
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.25;
      color: #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: .78;
    }

    .menu-item .arrow {
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #000;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 12px;
      transition: transform .12s ease-out, background-color .12s, color .12s, border-color .12s;
      flex-shrink: 0;
    }
    .menu-item:hover .arrow {
      transform: translateX(2px) rotate(-8deg);
      background: #000;
      color: #fff;
    }

    .menu-item.tone-yellow { background: var(--secondary); }
    .menu-item.tone-yellow .name,
    .menu-item.tone-yellow .desc { color: #000; }
    .menu-item.tone-yellow .icon { background: #000; color: #fff; }
    .menu-item.tone-yellow .arrow { border-color: #000; background: #fff; color: #000; }
    .menu-item.tone-yellow:hover .arrow { background: #000; color: #fff; }

    .menu-item.tone-violet { background: var(--muted); }
    .menu-item.tone-violet .name,
    .menu-item.tone-violet .desc { color: #000; }
    .menu-item.tone-violet .icon { background: #000; color: #fff; }
    .menu-item.tone-violet .arrow { border-color: #000; background: #fff; color: #000; }
    .menu-item.tone-violet:hover .arrow { background: #000; color: #fff; }

    .menu-item.tone-red { background: var(--accent); }
    .menu-item.tone-red:hover { background: var(--accent-hover); }
    .menu-item.tone-red .name { color: #fff; }
    .menu-item.tone-red .desc { color: #fff; opacity: .92; }
    .menu-item.tone-red .icon { background: #fff; color: var(--accent); }
    .menu-item.tone-red .arrow { border-color: #fff; background: transparent; color: #fff; }
    .menu-item.tone-red:hover .arrow { background: #fff; color: var(--accent); }

    /* ===== Featured (Store) ===== */
    .menu-item.featured {
      min-height: 104px;
      padding: 20px 22px;
      background: var(--accent);
      color: #fff;
      box-shadow: var(--shadow-lg);
      transform: rotate(-1deg);
    }
    .menu-item.featured:hover {
      background: var(--accent-hover);
      transform: rotate(-1deg) translate(-2px, -2px);
      box-shadow: 11px 11px 0 0 #000;
    }
    .menu-item.featured:active {
      transform: rotate(-1deg) translate(3px, 3px);
      box-shadow: 0 0 0 0 #000;
    }
    .menu-item.featured .icon {
      flex: 0 0 54px;
      width: 54px;
      height: 54px;
      background: #fff;
      color: var(--accent);
    }
    .menu-item.featured .icon i { font-size: 21px; }
    .menu-item.featured .name { color: #fff; font-size: 19px; }
    .menu-item.featured .desc { color: #fff; opacity: .92; font-size: 13px; }
    .menu-item.featured .arrow {
      border-color: #fff;
      background: transparent;
      color: #fff;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      font-size: 12px;
    }
    .menu-item.featured:hover .arrow {
      background: #fff;
      color: var(--accent);
    }

    /* ===== Footer ===== */
    .footer {
      margin-top: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--secondary);
      color: #000;
      border: var(--border);
      box-shadow: var(--shadow-md);
      padding: 13px 16px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      animation: popIn .4s .25s var(--snap) both;
      transform: rotate(1deg);
      flex: 0 0 auto;
    }
    .footer b {
      display: inline-block;
      background: #000;
      color: var(--secondary);
      padding: 3px 8px 1px;
      font-family: var(--font-display);
      letter-spacing: .1em;
      margin-left: 4px;
    }
    .footer-dots { display: flex; gap: 8px; }
    .footer-dots span {
      display: block;
      width: 8px;
      height: 8px;
      background: #000;
      border-radius: 50%;
    }
    .footer-dots span:nth-child(2) { background: var(--accent); animation: dotPop 1.6s ease-in-out infinite; }
    .footer-dots span:nth-child(3) { background: var(--muted); animation: dotPop 1.6s ease-in-out infinite .4s; }
    @keyframes dotPop {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.35); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== Small mobile ===== */
    @media (max-width: 420px) {
      .app { padding: 10px 12px 0; }

      .store-name { padding: 6px 14px 2px; font-size: clamp(34px, 11.5vw, 54px); }
      .store-sub { gap: 10px; }
      .deco-line { flex: 0 1 36px; }

      .hero-text-top { margin: 6px 0 16px; }

      .menu-wrap { padding-top: 68px; }
      .menu-wrap::after { font-size: 33px; top: 27px; }

  <script>
    /* ===== Clock ===== */
    function tick() {
      const d = new Date();
      const f = n => String(n).padStart(2, '0');
      const el = document.getElementById('fClock');
      if (el) el.textContent = f(d.getHours()) + ':' + f(d.getMinutes());
    }
    tick();
    setInterval(tick, 15000);

    /* ===== Lock zoom ===== */
    (function lockZoom() {
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
        document.addEventListener(evt, e => e.preventDefault(), { passive: false });
      });

      let lastTouch = 0;
      document.addEventListener('touchend', e => {
        const now = Date.now();
        if (now - lastTouch <= 300) e.preventDefault();
        lastTouch = now;
      }, { passive: false });

      document.addEventListener('wheel', e => {
        if (e.ctrlKey) e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchmove', e => {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    })();

    /* ===== Video: autoplay + adaptive aspect ratio ===== */
    (function responsiveVideoPlayback() {
      const mobileVideo   = document.getElementById('heroVideoMobile');
      const desktopVideo  = document.getElementById('heroVideoDesktop');
      const mobileCard    = document.getElementById('cardMobile');
      const desktopCard   = document.getElementById('cardDesktop');
      if (!mobileVideo || !desktopVideo) return;

      const desktopQuery = window.matchMedia('(min-width: 900px)');

      // Pastikan atribut video aman
      [mobileVideo, desktopVideo].forEach(video => {
        video.muted = true;
        video.playsInline = true;
        video.loop = true;
        video.addEventListener('contextmenu', e => e.preventDefault());
      });

      // Sinkronkan aspect-ratio card dengan rasio asli video (anti-gepeng)
      function syncAspectRatio(video, card) {
        if (!video || !card) return;
        const apply = () => {
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            card.style.aspectRatio = video.videoWidth + ' / ' + video.videoHeight;
          }
        };
        if (video.readyState >= 1) apply();
        video.addEventListener('loadedmetadata', apply);
      }
      syncAspectRatio(mobileVideo, mobileCard);
      syncAspectRatio(desktopVideo, desktopCard);

      // Coba play dengan fallback
      function safePlay(video) {
        if (!video) return;
        const p = video.play();
        if (p && typeof p.catch === 'function') {
          p.catch(() => {
            const resume = () => {
              video.play().catch(() => {});
              document.removeEventListener('touchstart', resume);
              document.removeEventListener('click', resume);
            };
            document.addEventListener('touchstart', resume, { once: true, passive: true });
            document.addEventListener('click', resume, { once: true });
          });
        }
      }

      function updateVideoForScreen() {
        const isDesktop = desktopQuery.matches;
        const activeVideo   = isDesktop ? desktopVideo   : mobileVideo;
        const inactiveVideo = isDesktop ? mobileVideo    : desktopVideo;

        try { inactiveVideo.pause(); } catch (e) {}

        // Jika video aktif belum punya data, paksa load sekali
        if (activeVideo.readyState === 0) {
          try { activeVideo.load(); } catch (e) {}
        }

        safePlay(activeVideo);
      }

      // Jalankan segera
      updateVideoForScreen();

      // Event listener
      if (desktopQuery.addEventListener) {
        desktopQuery.addEventListener('change', updateVideoForScreen);
      } else {
        desktopQuery.addListener(updateVideoForScreen);
      }
      window.addEventListener('orientationchange', updateVideoForScreen);
      window.addEventListener('resize', updateVideoForScreen);

      // Saat video siap, pastikan tetap play (khusus video yang sedang aktif)
      [mobileVideo, desktopVideo].forEach(video => {
        video.addEventListener('canplay', () => {
          const isActive = (video === desktopVideo) === desktopQuery.matches;
          if (isActive && video.paused) safePlay(video);
        });
      });
    })();
  </script>
