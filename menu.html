<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>𝐋𝐮𝐯𝐢𝐞𝐥𝐥𝐞𝐌𝐚𝐫𝐤𝐞𝐭𝐳</title>

  <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
  <meta name="theme-color" content="#fffaff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    :root {
      --pink: #f2a8d0;
      --pink-soft: #ffe4f1;
      --pink-deep: #e58fbd;
      --purple: #a78bfa;
      --purple-deep: #7954c8;
      --purple-soft: #f0eaff;

      --ink: #453552;
      --ink-soft: #5a4370;
      --muted: #8b7898;
      --muted-2: #a896b3;

      --bg: #fffaff;
      --border: rgba(207, 180, 242, .42);
      --border-strong: rgba(175, 139, 230, .72);

      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 22px;
      --radius-full: 999px;

      --font-sans: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --ease-smooth: cubic-bezier(.22, 1, .36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    /* ============ ZOOM LOCK ============ */
    html {
      background: var(--bg);
      scroll-behavior: smooth;
      touch-action: pan-y;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background:
        radial-gradient(ellipse at 8% 5%, rgba(255,209,230,.55), transparent 34%),
        radial-gradient(ellipse at 92% 35%, rgba(255,225,239,.72), transparent 34%),
        radial-gradient(ellipse at 50% 95%, rgba(232,220,255,.5), transparent 42%),
        linear-gradient(160deg, #fffafd 0%, #fff5fa 48%, #faf5ff 100%);
      color: var(--ink);
      font-family: var(--font-sans);
      font-weight: 500;
      min-height: 100vh;
      padding: 0 0 24px 0;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      touch-action: pan-y;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(rgba(228,155,190,.28) .8px, transparent .8px);
      background-size: 20px 20px;
      mask-image: linear-gradient(to bottom, #000, transparent 88%);
      -webkit-mask-image: linear-gradient(to bottom, #000, transparent 88%);
      opacity: .45;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      opacity: .015;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      mix-blend-mode: multiply;
    }

    /* ============ LIGHTNING FIELD ============ */
    .lightning-field {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 1;
      overflow: hidden; opacity: .22;
    }
    .flash {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(255,190,221,.18), transparent 70%);
      opacity: 0;
      animation: flashSmooth 12s ease-in-out infinite;
    }
    .flash.f2 { animation-delay: 4s; animation-duration: 14s; }
    .flash.f3 { animation-delay: 8s; animation-duration: 16s; }

    @keyframes flashSmooth {
      0%, 70%, 100% { opacity: 0; }
      72% { opacity: .35; } 74% { opacity: .08; }
      76% { opacity: .45; } 78% { opacity: .15; }
      80% { opacity: .55; } 82% { opacity: 0; }
    }

    .bolt {
      position: absolute; width: 40px;
      opacity: 0;
      filter: drop-shadow(0 0 8px rgba(244,168,203,.4));
      animation: boltSmooth 10s ease-in-out infinite;
      will-change: opacity, transform;
      transform-origin: center top;
    }
    .bolt svg { width: 100%; height: auto; display: block; }
    .bolt svg path { fill: #f2a8ca; }
    .bolt.b1 { top: 5%; left: 8%; animation-delay: 0s; width: 32px; }
    .bolt.b2 { top: 25%; right: 12%; animation-delay: 2s; width: 40px; }
    .bolt.b3 { bottom: 30%; left: 5%; animation-delay: 5s; width: 28px; }
    .bolt.b4 { top: 60%; right: 6%; animation-delay: 7s; width: 36px; }
    .bolt.b5 { top: 75%; left: 15%; animation-delay: 1.2s; width: 24px; }
    .bolt.b6 { top: 12%; right: 30%; animation-delay: 6s; width: 30px; }

    @keyframes boltSmooth {
      0%, 72%, 100% { opacity: 0; transform: translateY(0) scale(.9); }
      74% { opacity: .6; transform: translateY(-2px) scale(1); }
      75% { opacity: 1; transform: translateY(-1px) scale(1.08); }
      76% { opacity: .7; transform: translateY(0) scale(1.02); }
      78% { opacity: .4; transform: translateY(1px) scale(.98); }
      82% { opacity: 0; transform: translateY(2px) scale(.95); }
    }

    /* ============ APP ============ */
    .app {
      width: 100%;
      max-width: 620px;
      padding: 0 16px;
      position: relative;
      z-index: 2;
    }

    /* ============ TOP BAR ============ */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0 12px;
      animation: fadeUp 1s var(--ease-smooth) both;
    }

    .clock-chip {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(206,178,247,.58);
      border-radius: var(--radius-full);
      padding: 7px 18px 7px 13px;
      box-shadow: 0 5px 22px rgba(167,139,250,.12), 0 4px 18px rgba(242,168,208,.12);
      font-family: var(--font-mono); font-weight: 700; font-size: 13px;
      color: #7954a5;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      touch-action: manipulation;
    }
    .clock-chip .led {
      width: 9px; height: 9px; border-radius: 50%;
      background: linear-gradient(135deg, #f2a8d0, #a78bfa);
      box-shadow: 0 0 12px rgba(167,139,250,.4);
      animation: pulseLed 2.8s ease-in-out infinite;
    }
    .clock-chip .time { letter-spacing: 1px; color: #7954a5; }

    @keyframes pulseLed {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .55; transform: scale(.85); }
    }

    .avatar-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #f6c1df 0%, #d8c8ff 100%);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 7px 22px rgba(167,139,250,.23);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-sans); font-weight: 800; font-size: 16px;
      color: #5c4278;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      transition: transform .35s var(--ease-smooth), box-shadow .35s var(--ease-smooth);
    }
    .avatar-btn:hover { transform: scale(1.06); box-shadow: 0 10px 28px rgba(167,139,250,.32); }
    .avatar-btn:active { transform: scale(.94); }

    /* ==========================================================
       HERO TITLE — ANIMATED, ELEGANT, NO PILL
       ========================================================== */
    .hero-text-top {
      text-align: center;
      margin: 8px 0 20px;
      animation: fadeUp 1s var(--ease-smooth) both;
      animation-delay: .1s;
    }

    .store-heading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin: 0 auto;
      line-height: 1;
    }

    .store-name {
      display: inline-block;
      position: relative;
      font-family: var(--font-sans);
      font-weight: 900;
      font-size: clamp(44px, 9.5vw, 64px);
      letter-spacing: -0.05em;
      line-height: 1.1;
      
      /* FIX: Mencegah huruf terakhir terpotong pada background-clip: text */
      padding-right: 0.15em;
      margin-right: -0.15em;
      padding-left: 0.05em;
      margin-left: -0.05em;

      background: linear-gradient(
        100deg,
        #e58fbd 0%,
        #b18af2 28%,
        #8b6bd1 52%,
        #b18af2 76%,
        #e58fbd 100%
      );
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      clip-path: inset(0 100% 0 0);
      animation:
        revealName 1.2s cubic-bezier(.22, 1, .36, 1) .3s both,
        gradientFlow 5s ease-in-out infinite,
        titleFloat 4s ease-in-out infinite;
      filter: drop-shadow(0 6px 22px rgba(167,139,250,.3));
    }

    .store-name .shine {
      position: absolute; inset: 0;
      background: linear-gradient(
        105deg,
        transparent 38%,
        rgba(255,255,255,.85) 48%,
        rgba(255,255,255,.5) 52%,
        transparent 62%
      );
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: shimmerSweep 4.5s ease-in-out infinite;
      pointer-events: none;
    }

    /* ---- STORE SUBTITLE ---- */
    .store-sub {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 340px;
      padding: 0 8px;
      opacity: 0;
      animation: subReveal 1.2s cubic-bezier(.22, 1, .36, 1) 1s forwards;
    }

    .deco-line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(167,139,250,.6) 50%, transparent);
      position: relative;
      transform-origin: center;
      transform: scaleX(0);
      animation: lineGrow 1s cubic-bezier(.22, 1, .36, 1) 1.2s forwards;
    }
    .deco-line::before {
      content: '';
      position: absolute; top: 50%; left: 50%;
      width: 5px; height: 5px; border-radius: 50%;
      background: #b18af2;
      box-shadow: 0 0 8px rgba(167,139,250,.8), 0 0 16px rgba(167,139,250,.4);
      transform: translate(-50%, -50%);
      animation: dotPulse 3s ease-in-out infinite;
    }

    .store-label {
      display: inline-block;
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: clamp(10px, 1.3vw, 13px);
      font-weight: 700;
      letter-spacing: clamp(6px, 1vw, 10px);
      
      padding-right: 4px;
      margin-right: -4px;
      
      background: linear-gradient(100deg, #b18af2 0%, #e58fbd 50%, #b18af2 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: gradientFlow 3s ease-in-out infinite;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @keyframes revealName {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }
    @keyframes gradientFlow {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 100% center; }
    }
    @keyframes titleFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.012); }
    }
    @keyframes shimmerSweep {
      0% { background-position: 250% center; }
      100% { background-position: -50% center; }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: .4; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.6); }
    }
    @keyframes subReveal {
      0% { opacity: 0; transform: translateY(16px) scale(0.96); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes lineGrow {
      0% { transform: scaleX(0); opacity: 0; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    /* ============ VIDEO ============ */
    .video-wrap {
      margin-bottom: 14px;
      animation: fadeUp 1s var(--ease-smooth) both;
      animation-delay: .2s;
    }

    .video-card {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(255,255,255,.95);
      box-shadow:
        0 0 0 4px rgba(255,255,255,.75),
        0 14px 36px rgba(167,139,250,.18),
        0 10px 28px rgba(242,168,208,.16);
      transition: box-shadow .6s var(--ease-smooth), transform .6s var(--ease-smooth);
      pointer-events: none;
      touch-action: pan-y;
    }
    .video-card:hover {
      box-shadow: 0 0 0 4px #fff, 0 18px 42px rgba(167,139,250,.24), 0 12px 30px rgba(242,168,208,.2);
      transform: translateY(-2px);
    }
    .video-card video {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      background: #000; filter: none;
      transition: transform 1s var(--ease-smooth), filter 1s var(--ease-smooth);
      pointer-events: none;
      -webkit-user-select: none; user-select: none;
    }
    .video-card:hover video { filter: brightness(1.04) saturate(1.05); transform: scale(1.015); }

    .video-card-mobile { display: block; }
    .video-card-desktop { display: none; }

    /* ============ BOTTOM TEXT ============ */
    .hero-text-bottom {
      text-align: center;
      margin: 4px 0 18px;
      animation: fadeUp 1s var(--ease-smooth) both;
      animation-delay: .3s;
    }
    .hero-text-bottom p {
      font-size: clamp(13px, 2.6vw, 15px);
      color: var(--muted);
      font-weight: 500;
      line-height: 1.45;
    }

    /* ============ MENU ============ */
    .menu-wrap {
      position: relative;
      margin-top: 2px;
      padding-top: 44px;
      animation: fadeUp 1s var(--ease-smooth) both;
      animation-delay: .4s;
      touch-action: pan-y;
    }

    .menu-wrap::before {
      content: "EXPLORE";
      position: absolute; top: 0; left: 4px;
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 700;
      letter-spacing: 3px;
      color: #c38aa6;
    }
    .menu-wrap::after {
      content: "MENU";
      position: absolute; top: 14px; left: 2px;
      font-family: var(--font-sans);
      font-size: 25px; line-height: 1; font-weight: 900;
      letter-spacing: -.6px;
      background: linear-gradient(100deg, #8b5fa7 0%, #a78bfa 60%, #e58fbd 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 17px 19px;
      min-height: 86px;
      background: rgba(255, 255, 255, .84);
      border: 1px solid var(--border);
      border-radius: 19px;
      text-decoration: none;
      color: var(--ink);
      box-shadow:
        0 1px 2px rgba(167, 139, 250, .04),
        0 5px 16px rgba(242, 168, 208, .08);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      transition:
        transform .45s var(--ease-smooth),
        box-shadow .45s var(--ease-smooth),
        border-color .45s var(--ease-smooth),
        background .45s var(--ease-smooth);
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      cursor: pointer;
      position: relative;
      animation: cardIn .7s var(--ease-smooth) both;
      will-change: transform;
    }
    .menu-item * {
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      pointer-events: none;
    }

    .menu-item:nth-child(1) { animation-delay: .05s; }
    .menu-item:nth-child(2) { animation-delay: .10s; }
    .menu-item:nth-child(3) { animation-delay: .15s; }
    .menu-item:nth-child(4) { animation-delay: .20s; }
    .menu-item:nth-child(5) { animation-delay: .25s; }
    .menu-item:nth-child(6) { animation-delay: .30s; }
    .menu-item:nth-child(7) { animation-delay: .35s; }
    .menu-item:nth-child(8) { animation-delay: .40s; }

    .menu-item:hover {
      background: linear-gradient(135deg, #ffffff 0%, #fff5fb 55%, #f8f1ff 100%);
      border-color: var(--border-strong);
      box-shadow:
        0 2px 4px rgba(167, 139, 250, .06),
        0 14px 32px rgba(167, 139, 250, .14),
        0 10px 24px rgba(242, 168, 208, .12);
      transform: translateY(-2px);
    }
    .menu-item:active {
      transform: translateY(0) scale(.985);
      transition-duration: .16s;
    }

    .menu-item .icon {
      flex: 0 0 50px;
      width: 50px; height: 50px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #ffe9f4 0%, #f0e8ff 100%);
      color: #9066c9;
      border: 1px solid rgba(216, 184, 245, .55);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .9),
        0 2px 6px rgba(167, 139, 250, .08);
      transition: transform .45s var(--ease-smooth), background .35s ease, box-shadow .35s ease;
    }
    .menu-item .icon i { font-size: 20px; line-height: 1; }
    .menu-item:hover .icon {
      transform: scale(1.06);
      background: linear-gradient(145deg, #ffe0ef 0%, #e6d9ff 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .95),
        0 6px 16px rgba(167, 139, 250, .2);
    }

    .menu-item .info {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: 3px;
    }
    .menu-item .name {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 15.5px;
      line-height: 1.2;
      letter-spacing: -.15px;
      color: #4b3b59;
      transition: color .35s ease;
    }
    .menu-item .desc {
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: .1px;
      color: #9b87a8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color .35s ease;
    }
    .menu-item:hover .name { color: #3a2c48; }
    .menu-item:hover .desc { color: #7c6890; }

    .menu-item .arrow {
      flex: 0 0 30px;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-size: 11px;
      color: #b79bd0;
      background: transparent;
      transition: transform .4s var(--ease-smooth), color .35s ease, background .35s ease;
    }
    .menu-item:hover .arrow {
      transform: translateX(3px);
      color: #7954c8;
      background: rgba(167, 139, 250, .12);
    }

    .menu-item.featured {
      min-height: 98px;
      padding: 20px 22px;
      background:
        radial-gradient(circle at 95% 10%, rgba(210, 190, 255, .55), transparent 42%),
        linear-gradient(135deg, #ffffff 0%, #fff2f8 55%, #f3edff 100%);
      border: 1px solid rgba(194, 159, 239, .68);
      box-shadow:
        0 2px 4px rgba(167, 139, 250, .06),
        0 12px 28px rgba(167, 139, 250, .14),
        0 8px 22px rgba(242, 168, 208, .12);
    }
    .menu-item.featured:hover {
      box-shadow:
        0 3px 6px rgba(167, 139, 250, .08),
        0 18px 38px rgba(167, 139, 250, .2),
        0 12px 28px rgba(242, 168, 208, .16);
    }
    .menu-item.featured .icon {
      flex: 0 0 56px;
      width: 56px; height: 56px;
      border-radius: 16px;
      background: linear-gradient(145deg, #f8c4df 0%, #cfc0ff 100%);
      color: #6d4a9c;
      border-color: rgba(175, 139, 230, .55);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .95),
        0 4px 12px rgba(167, 139, 250, .16);
    }
    .menu-item.featured .icon i { font-size: 22px; }
    .menu-item.featured .name { font-size: 18px; font-weight: 800; }
    .menu-item.featured .desc { font-size: 12.5px; color: #8b6ba0; }
    .menu-item.featured .arrow { color: #9066c9; }

    /* ============ FOOTER ============ */
    .footer {
      margin-top: 26px;
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--font-mono);
      font-size: 11.5px; font-weight: 500;
      color: var(--muted);
      padding: 14px 2px 4px;
      border-top: 1px solid rgba(207,180,242,.45);
      animation: fadeUp 1s var(--ease-smooth) both;
      animation-delay: .6s;
    }
    .footer b {
      font-weight: 800;
      background: linear-gradient(90deg, #d77eae, #9270d4);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .footer-dots { display: flex; gap: 6px; }
    .footer-dots span {
      display: block; width: 6px; height: 6px; border-radius: 50%;

  <script>
    function tick() {
      const d = new Date();
      const f = n => String(n).padStart(2, '0');
      document.getElementById('fClock').textContent = f(d.getHours()) + ':' + f(d.getMinutes());
    }
    tick();
    setInterval(tick, 15000);

    /* ZOOM LOCK */
    (function lockZoom() {
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
        document.addEventListener(evt, e => e.preventDefault(), { passive: false });
      });

      let lastTouch = 0;
      document.addEventListener('touchend', e => {
        const now = Date.now();
        if (now - lastTouch <= 300) e.preventDefault();
        lastTouch = now;
      }, { passive: false });

      document.addEventListener('wheel', e => {
        if (e.ctrlKey) e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchmove', e => {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    })();

    /* Responsive video playback */
    (function responsiveVideoPlayback() {
      const mobileVideo = document.getElementById('heroVideoMobile');
      const desktopVideo = document.getElementById('heroVideoDesktop');
      if (!mobileVideo || !desktopVideo) return;

      [mobileVideo, desktopVideo].forEach(video => {
        video.muted = true;
        video.playsInline = true;
        video.loop = true;
        video.addEventListener('contextmenu', e => e.preventDefault());
      });

      const desktopQuery = window.matchMedia('(min-width: 900px)');

      function updateVideoForScreen() {
        const activeVideo = desktopQuery.matches ? desktopVideo : mobileVideo;
        const inactiveVideo = desktopQuery.matches ? mobileVideo : desktopVideo;

        inactiveVideo.pause();
        if (activeVideo.readyState < 2) activeVideo.load();

        const playPromise = activeVideo.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {
            const resume = () => {
              activeVideo.play().catch(() => {});
              document.removeEventListener('touchstart', resume);
              document.removeEventListener('click', resume);
              document.removeEventListener('scroll', resume);
            };
            document.addEventListener('touchstart', resume, { once: true, passive: true });
            document.addEventListener('click', resume, { once: true });
            document.addEventListener('scroll', resume, { once: true, passive: true });
          });
        }
      }

      updateVideoForScreen();
      if (desktopQuery.addEventListener) {
        desktopQuery.addEventListener('change', updateVideoForScreen);
      } else {
        desktopQuery.addListener(updateVideoForScreen);
      }
      window.addEventListener('orientationchange', updateVideoForScreen);
      window.addEventListener('resize', updateVideoForScreen);
    })();

    console.log('🌸 Luvielle Store — fixed clipping on letter e & smooth title animation');
  </script>
