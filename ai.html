<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>
<title>SATXAI</title>

<style>
:root{
  --blue:#3b82f6;
  --blue-dark:#2563eb;
  --blue2:#60a5fa;
  --blue-soft:#172554;
  --blue-light:#1e3a8a;

  /* ===== PALET ABU ===== */
  --bg:#0a0a0c;
  --bg2:#121215;

  --surface:#17171b;
  --surface2:#1b1b20;
  --surface-soft:#131317;

  --ink:#f2f2f4;
  --ink-soft:#cfcfd6;
  --ink-mute:#8b8b95;

  --line:#28282e;
  --line-blue:#1e40af;

  --danger:#f87171;
  --success:#4ade80;

  --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

body{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--ink);
}

button,
textarea,
input{
  font:inherit;
}

button{
  border:0;
  outline:0;
}

/* =========================================================
   APP + ANIMATED GREY GLOW BACKGROUND
========================================================= */

.app{
  position:relative;

  width:100%;
  height:100dvh;
  min-height:0;

  overflow:hidden;

  display:flex;
  flex-direction:column;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(161,161,170,.14),
      transparent 46%
    ),
    linear-gradient(
      180deg,
      #16161a 0%,
      #0d0d10 55%,
      #08080a 100%
    );
}

/* ---------- LAYER GLOW ---------- */

.bg-layer{
  position:absolute;
  inset:0;

  z-index:0;

  overflow:hidden;
  pointer-events:none;

  contain:strict;
}

.glow{
  position:absolute;

  display:block;

  border-radius:50%;

  filter:blur(72px);

  opacity:.55;

  will-change:transform,opacity;

  transform:translate3d(0,0,0);
}

.glow-1{
  width:62vmax;
  height:62vmax;

  top:-24vmax;
  left:-20vmax;

  background:radial-gradient(
    circle at center,
    rgba(180,182,190,.42) 0%,
    rgba(140,142,150,.20) 40%,
    rgba(140,142,150,0) 72%
  );

  animation:
    floatA 24s ease-in-out infinite alternate,
    pulseA 11s ease-in-out infinite;
}

.glow-2{
  width:56vmax;
  height:56vmax;

  bottom:-26vmax;
  right:-16vmax;

  background:radial-gradient(
    circle at center,
    rgba(96,165,250,.34) 0%,
    rgba(96,165,250,.14) 42%,
    rgba(96,165,250,0) 72%
  );

  animation:
    floatB 30s ease-in-out infinite alternate,
    pulseB 14s ease-in-out infinite;
}

.glow-3{
  width:46vmax;
  height:46vmax;

  top:32%;
  left:48%;

  background:radial-gradient(
    circle at center,
    rgba(226,232,240,.24) 0%,
    rgba(203,213,225,.10) 45%,
    rgba(203,213,225,0) 72%
  );

  animation:
    floatC 36s ease-in-out infinite alternate,
    pulseA 17s ease-in-out infinite;
}

/* ---------- GRID HALUS ---------- */

.bg-layer::after{
  content:"";

  position:absolute;
  inset:-60px;

  background-image:
    linear-gradient(
      rgba(255,255,255,.030) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.030) 1px,
      transparent 1px
    );

  background-size:54px 54px;

  -webkit-mask-image:
    radial-gradient(
      circle at 50% 38%,
      #000 0%,
      rgba(0,0,0,.35) 55%,
      transparent 82%
    );

  mask-image:
    radial-gradient(
      circle at 50% 38%,
      #000 0%,
      rgba(0,0,0,.35) 55%,
      transparent 82%
    );

  animation:gridDrift 34s linear infinite;
}

@keyframes floatA{
  0%{
    transform:translate3d(0,0,0) scale(1);
  }
  50%{
    transform:translate3d(7vw,9vh,0) scale(1.16);
  }
  100%{
    transform:translate3d(-5vw,5vh,0) scale(.92);
  }
}

@keyframes floatB{
  0%{
    transform:translate3d(0,0,0) scale(1.05);
  }
  50%{
    transform:translate3d(-8vw,-7vh,0) scale(.9);
  }
  100%{
    transform:translate3d(4vw,-12vh,0) scale(1.18);
  }
}

@keyframes floatC{
  0%{
    transform:translate3d(-50%,0,0) scale(.95);
  }
  50%{
    transform:translate3d(-62%,-8vh,0) scale(1.22);
  }
  100%{
    transform:translate3d(-38%,7vh,0) scale(1);
  }
}

@keyframes pulseA{
  0%,100%{
    opacity:.42;
  }
  50%{
    opacity:.72;
  }
}

@keyframes pulseB{
  0%,100%{
    opacity:.34;
  }
  50%{
    opacity:.62;
  }
}

@keyframes gridDrift{
  from{
    background-position:0 0, 0 0;
  }
  to{
    background-position:54px 54px, 54px 54px;
  }
}

/* =========================================================
   INTRO
========================================================= */

.intro{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:#0a0a0c;

  transition:
    opacity .45s ease,
    visibility .45s ease;
}

.intro::before{
  content:"";

  position:absolute;

  width:70vmax;
  height:70vmax;

  border-radius:50%;

  background:radial-gradient(
    circle at center,
    rgba(161,161,170,.20),
    transparent 68%
  );

  filter:blur(70px);

  animation:pulseA 6s ease-in-out infinite;
}

.intro.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro-logo,
.intro-title,
.intro-subtitle,
.intro-line{
  position:relative;
  z-index:1;
}

.intro-logo{
  width:64px;
  height:64px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:18px;

  background:var(--blue);
  color:#fff;

  font-size:26px;
  font-weight:800;

  box-shadow:
    0 14px 35px rgba(37,99,235,.28);

  animation:
    introFloat 1.2s ease-in-out infinite alternate;
}

.intro-title{
  margin-top:18px;

  font-size:22px;
  font-weight:800;
  letter-spacing:-.6px;

  color:#f8fafc;
}

.intro-subtitle{
  margin-top:5px;

  color:var(--ink-mute);
  font-size:13px;
}

.intro-line{
  width:110px;
  height:3px;

  margin-top:22px;

  overflow:hidden;
  border-radius:999px;

  background:#26262c;
}

.intro-line::after{
  content:"";

  display:block;

  width:45%;
  height:100%;

  border-radius:999px;
  background:var(--blue);

  animation:
    introLoading 1s ease-in-out infinite;
}

@keyframes introFloat{
  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-6px);
  }
}

@keyframes introLoading{
  0%{
    transform:translateX(-120%);
  }

  100%{
    transform:translateX(250%);
  }
}

/* =========================================================
   HEADER
========================================================= */

.header{
  position:relative;

  flex:0 0 auto;
  width:100%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    max(14px, env(safe-area-inset-top))
    18px
    14px;

  background:rgba(15,15,18,.78);

  border-bottom:1px solid var(--line);

  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);

  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:var(--blue);
  color:#fff;

  font-size:17px;
  font-weight:800;

  box-shadow:
    0 7px 18px rgba(37,99,235,.30);
}

.brand-text{
  display:flex;
  flex-direction:column;
  gap:1px;
}

.brand-name{
  font-size:16px;
  font-weight:800;
  letter-spacing:-.3px;
  color:#f8fafc;
}

.brand-status{
  display:flex;
  align-items:center;
  gap:5px;

  color:var(--ink-mute);
  font-size:11px;
}

.status-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:
    0 0 0 3px rgba(34,197,94,.12);
}

.header-badge{
  padding:7px 10px;

  border:1px solid rgba(96,165,250,.30);
  border-radius:999px;

  background:rgba(96,165,250,.10);
  color:#93c5fd;

  font-size:11px;
  font-weight:700;
}

/* =========================================================
   CHAT
========================================================= */

.chat-scroll{
  position:relative;
  z-index:1;

  flex:1 1 auto;
  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  scroll-behavior:smooth;

  padding:22px 18px 18px;
}

.chat-scroll::-webkit-scrollbar{
  width:5px;
}

.chat-scroll::-webkit-scrollbar-track{
  background:transparent;
}

.chat-scroll::-webkit-scrollbar-thumb{
  background:#35353d;
  border-radius:999px;
}

.chat{
  width:100%;
  max-width:850px;

  margin:0 auto;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{
  min-height:100%;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  text-align:center;

  padding:35px 10px 45px;
}

.welcome-orb{
  width:76px;
  height:76px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:22px;

  background:#17171b;

  border:1px solid rgba(96,165,250,.28);

  color:#60a5fa;

  box-shadow:
    0 15px 35px rgba(0,0,0,.35),
    0 0 40px rgba(96,165,250,.10);
}

.welcome-orb span{
  font-size:30px;
  font-weight:900;
}

.welcome h1{
  margin:20px 0 7px;

  font-size:30px;
  line-height:1.1;

  letter-spacing:-1.2px;

  color:#f8fafc;
}

.welcome p{
  max-width:480px;

  margin:0;

  color:var(--ink-mute);

  font-size:14px;
  line-height:1.6;
}

.suggestions{
  width:100%;
  max-width:700px;

  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));

  gap:10px;

  margin-top:28px;
}

.suggestion{
  padding:15px;

  text-align:left;

  border:1px solid var(--line);
  border-radius:14px;

  background:rgba(23,23,27,.72);
  color:var(--ink);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  cursor:pointer;

  transition:
    border-color .2s ease,
    background .2s ease,
    transform .2s ease,
    box-shadow .2s ease;
}

.suggestion:hover{
  border-color:rgba(96,165,250,.35);
  background:rgba(31,31,38,.85);

  box-shadow:
    0 8px 24px rgba(0,0,0,.28),
    0 0 24px rgba(96,165,250,.08);

  transform:translateY(-1px);
}

.suggestion-title{
  font-size:13px;
  font-weight:750;
}

.suggestion-desc{
  margin-top:4px;

  color:var(--ink-mute);

  font-size:11px;
  line-height:1.4;
}

/* =========================================================
   MESSAGE
========================================================= */

.message-row{
  width:100%;

  display:flex;

  margin-bottom:18px;
}

.message-row.user{
  justify-content:flex-end;
}

.message-row.ai{
  justify-content:flex-start;
}

.message{
  width:auto;

  max-width:min(790px,92%);

  border-radius:17px;

  padding:12px 15px;

  font-size:14px;
  line-height:1.65;

  word-break:break-word;
}

.message.user{
  white-space:pre-wrap;

  background:var(--blue);
  color:#fff;

  border-bottom-right-radius:5px;

  box-shadow:
    0 8px 20px rgba(37,99,235,.22);
}

.message.ai{
  width:auto;

  background:rgba(23,23,27,.82);
  color:var(--ink-soft);

  border:1px solid var(--line);

  border-bottom-left-radius:5px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.28);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  padding:14px 16px;

  overflow:hidden;
}

/* =========================================================
   AI TEXT
========================================================= */

.ai-content{
  width:100%;
}

.ai-paragraph{
  margin:0 0 12px;
}

.ai-paragraph:last-child{
  margin-bottom:0;
}

.ai-line{
  margin:0 0 7px;
}

.ai-line:last-child{
  margin-bottom:0;
}

.ai-list{
  margin:8px 0 12px;
  padding-left:21px;
}

.ai-list li{
  margin-bottom:5px;
}

.ai-numbered-list{
  margin:8px 0 12px;
  padding-left:22px;
}

.ai-numbered-list li{
  margin-bottom:5px;
}

.ai-strong{
  font-weight:750;
  color:#f8fafc;
}

.ai-inline-code{
  padding:2px 6px;

  border-radius:6px;

  background:#1e1e24;

  border:1px solid #33333c;

  color:#bfdbfe;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  font-size:.9em;
}

/* =========================================================
   AI TYPEWRITER
========================================================= */

.ai-typewriter{
  white-space:pre-wrap;
  word-break:break-word;
}

.ai-cursor{
  display:inline-block;

  width:2px;
  height:17px;

  margin-left:2px;

  vertical-align:-3px;

  border-radius:2px;

  background:#60a5fa;

  animation:
    cursorBlink .8s ease-in-out infinite;
}

@keyframes cursorBlink{
  0%,
  45%{
    opacity:1;
  }

  50%,
  100%{
    opacity:0;
  }
}

/* =========================================================
   CODE BLOCK
========================================================= */

.code-block{
  position:relative;

  width:100%;

  margin:13px 0;

  overflow:hidden;

  border-radius:13px;

  background:#0d0d10;

  border:1px solid #2a2a30;

  box-shadow:
    0 8px 22px rgba(0,0,0,.35);
}

.code-block:last-child{
  margin-bottom:0;
}

.code-header{
  min-height:39px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:7px 9px 7px 13px;

  background:#141419;

  border-bottom:1px solid rgba(255,255,255,.07);
}

.code-language{
  color:#94a3b8;

  font-size:10px;
  font-weight:700;

  text-transform:uppercase;
  letter-spacing:.5px;
}

.copy-code-btn{
  display:flex;
  align-items:center;

  gap:5px;

  padding:6px 9px;

  border-radius:7px;

  background:#1e1e24;

  color:#cbd5e1;

  border:1px solid rgba(255,255,255,.08);

  font-size:10px;
  font-weight:700;

  cursor:pointer;

  transition:
    background .2s ease,
    color .2s ease,
    transform .15s ease;
}

.copy-code-btn:hover{
  background:#2a2a33;
  color:#fff;
}

.copy-code-btn:active{
  transform:scale(.95);
}

.copy-code-btn.copied{
  background:#14532d;
  color:#dcfce7;
}

.copy-icon{
  width:13px;
  height:13px;

  flex:0 0 13px;
}

.code-content{
  width:100%;

  margin:0;
  padding:15px;

  overflow-x:auto;

  color:#e2e8f0;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    "Liberation Mono",
    monospace;

  font-size:12.5px;
  line-height:1.65;

  white-space:pre;

  tab-size:2;
}

.code-content::-webkit-scrollbar{
  height:5px;
}

.code-content::-webkit-scrollbar-thumb{
  background:#35353d;
  border-radius:999px;
}

/* =========================================================
   TYPING DOTS
========================================================= */

.message.ai.typing-message{
  width:58px;
  min-width:58px;
  max-width:58px;

  height:42px;
  min-height:42px;

  padding:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:14px;
  border-bottom-left-radius:5px;

  overflow:hidden;
}

.typing{
  width:58px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:4px;
}

.typing span{
  display:block;

  width:6px;
  height:6px;

  flex:0 0 6px;

  border-radius:50%;

  background:var(--blue);

  animation:
    typing .9s infinite ease-in-out;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.30s;
}

@keyframes typing{
  0%,
  60%,
  100%{
    transform:translateY(0);
    opacity:.3;
  }

  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}

/* =========================================================
   GENERATED IMAGE
========================================================= */

.generated-image{
  width:100%;
  max-width:520px;

  display:block;

  border-radius:14px;

  border:1px solid var(--line);

  cursor:pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.generated-image:hover{
  transform:scale(1.01);

  box-shadow:
    0 12px 30px rgba(0,0,0,.35);
}

.image-message-label{
  margin-bottom:9px;

  color:var(--ink-mute);

  font-size:12px;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-wrap{
  position:relative;

  flex:0 0 auto;
  width:100%;

  padding:
    8px
    16px
    max(14px, env(safe-area-inset-bottom));

  background:
    linear-gradient(
      to bottom,
      rgba(10,10,12,.45),
      rgba(8,8,10,.96)
    );

  z-index:30;
}

.mode-bar{
  width:100%;
  max-width:850px;

  margin:0 auto 7px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:5px;
}

.mode-btn{
  padding:6px 10px;

  border-radius:999px;

  background:transparent;
  color:var(--ink-mute);

  font-size:11px;
  font-weight:700;

  cursor:pointer;

  transition:.2s ease;
}

.mode-btn.active{
  background:rgba(96,165,250,.14);
  color:#93c5fd;
}

.preview-wrap{
  display:none;

  width:100%;
  max-width:850px;

  margin:0 auto 7px;
}

.preview-wrap.show{
  display:flex;
}

.preview{
  position:relative;

  width:70px;
  height:70px;
}

.preview img{
  width:70px;
  height:70px;

  object-fit:cover;

  border-radius:12px;

  border:1px solid rgba(96,165,250,.35);
}

.preview-remove{
  position:absolute;

  top:-7px;
  right:-7px;

  width:22px;
  height:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#1b1b20;

  border:1px solid var(--line);

  color:var(--danger);

  font-size:14px;

  cursor:pointer;

  box-shadow:
    0 3px 10px rgba(0,0,0,.35);
}

.composer{
  width:100%;
  max-width:850px;

  margin:0 auto;

  display:flex;
  align-items:flex-end;

  gap:8px;

  padding:8px;

  background:rgba(23,23,27,.86);

  border:1px solid var(--line);

  border-radius:18px;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  box-shadow:
    0 10px 30px rgba(0,0,0,.35);

  transition:
    border-color .25s ease,
    box-shadow .25s ease;
}

.composer:focus-within{
  border-color:rgba(96,165,250,.45);

  box-shadow:
    0 10px 30px rgba(0,0,0,.35),
    0 0 28px rgba(59,130,246,.16);
}

.tool-btn{
  flex:0 0 40px;

  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:#141418;

  border:1px solid var(--line);

  color:#94a3b8;

  cursor:pointer;

  transition:
    background .2s ease,
    color .2s ease,
    border-color .2s ease;
}

.tool-btn:hover{
  background:rgba(96,165,250,.14);
  border-color:rgba(96,165,250,.35);
  color:#93c5fd;
}

.tool-btn svg{
  width:19px;
  height:19px;
}

.input-area{
  flex:1;
  min-width:0;
}

textarea{
  width:100%;

  min-height:40px;
  max-height:130px;

  display:block;

  resize:none;

  padding:10px 4px;

  border:0;
  outline:0;

  background:transparent;

  color:#f2f2f4;

/* ==========================================================

function getCustomErrorMessage(
  error,
  type = "chat"
){

  const errorText =
    String(
      error?.message ||
      error ||
      ""
    ).toLowerCase();


  if(
    errorText.includes("request too large") ||
    errorText.includes("output tokens per minute") ||
    errorText.includes("otpm") ||
    errorText.includes("rate limit") ||
    errorText.includes("too many requests") ||
    errorText.includes("429")
  ){

    return ERROR_MESSAGES.limit;

  }


  if(
    errorText.includes("401") ||
    errorText.includes("unauthorized") ||
    errorText.includes("invalid api key") ||
    errorText.includes("authentication")
  ){

    return ERROR_MESSAGES.auth;

  }


  if(
    errorText.includes("403") ||
    errorText.includes("forbidden") ||
    errorText.includes("permission")
  ){

    return ERROR_MESSAGES.permission;

  }


  if(
    errorText.includes("500") ||
    errorText.includes("502") ||
    errorText.includes("503") ||
    errorText.includes("504") ||
    errorText.includes("internal server") ||
    errorText.includes("bad gateway") ||
    errorText.includes("service unavailable")
  ){

    if(type === "image"){
      return ERROR_MESSAGES.imageGeneral;
    }

    return ERROR_MESSAGES.server;

  }


  if(
    errorText.includes("failed to fetch") ||
    errorText.includes("networkerror") ||
    errorText.includes("network error") ||
    errorText.includes("connection") ||
    errorText.includes("timeout") ||
    errorText.includes("timed out")
  ){

    return ERROR_MESSAGES.network;

  }


  if(type === "image"){

    if(
      errorText.includes(
        "worker tidak mengembalikan gambar"
      ) ||
      errorText.includes("image") ||
      errorText.includes("generate")
    ){

      return ERROR_MESSAGES.image;

    }

    return ERROR_MESSAGES.imageGeneral;

  }


  if(
    errorText.includes("400") ||
    errorText.includes("bad request") ||
    errorText.includes("invalid request")
  ){

    return ERROR_MESSAGES.badRequest;

  }


  return ERROR_MESSAGES.general;

}


/* ==========================================================
   CLEAN AI RESPONSE
========================================================== */

function cleanAIResponse(text){

  if(!text){
    return "";
  }

  let result =
    String(text)
      .replace(/\r\n/g,"\n")
      .replace(/\r/g,"\n");


  const codeBlocks = [];


  result =
    result.replace(
      /```[\s\S]*?```/g,
      block => {

        const index =
          codeBlocks.length;

        codeBlocks.push(block);

        return `@@SATXAI_CODE_${index}@@`;

      }
    );


  result =
    result

      .replace(
        /^\s*#{1,6}\s*/gm,
        ""
      )

      .replace(
        /^\s*(?:\*{3,}|_{3,}|-{3,})\s*$/gm,
        ""
      )

      .replace(
        /^\s*>\s?/gm,
        ""
      )

      .replace(
        /\*\*(.*?)\*\*/gs,
        "$1"
      )

      .replace(
        /__(.*?)__/gs,
        "$1"
      )

      .replace(
        /~~(.*?)~~/gs,
        "$1"
      );


  result =
    result.replace(
      /@@SATXAI_CODE_(\d+)@@/g,
      (_, index) =>
        codeBlocks[index]
    );


  result =
    result
      .replace(/\n{4,}/g,"\n\n")
      .trim();


  return result;

}


/* ==========================================================

function appendInlineText(
  container,
  text
){

  const parts =
    text.split(
      /(`[^`\n]+`)/g
    );


  parts.forEach(
    part => {

      if(
        part.startsWith("`") &&
        part.endsWith("`")
      ){

        const code =
          document.createElement("span");

        code.className =
          "ai-inline-code";

        code.textContent =
          part.slice(1,-1);

        container.appendChild(
          code
        );

      }else{

        const strongParts =
          part.split(
            /(\*\*[^\*]+\*\*)/g
          );


        strongParts.forEach(
          strongPart => {

            if(
              strongPart.startsWith("**") &&
              strongPart.endsWith("**")
            ){

              const strong =
                document.createElement("span");

              strong.className =
                "ai-strong";

              strong.textContent =
                strongPart.slice(2,-2);

              container.appendChild(
                strong
              );

            }else{

              container.appendChild(
                document.createTextNode(
                  strongPart
                )
              );

            }

          }
        );

      }

    }
  );

}

function createCodeBlock(
  code,
  language
){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "code-block";


  const header =
    document.createElement("div");

  header.className =
    "code-header";


  const languageLabel =
    document.createElement("span");

  languageLabel.className =
    "code-language";

  languageLabel.textContent =
    language ||
    "code";


  const copyButton =
    document.createElement("button");

  copyButton.type =
    "button";

  copyButton.className =
    "copy-code-btn";


  const setCopyNormal =
    () => {

      copyButton.classList.remove(
        "copied"
      );

      copyButton.innerHTML = `

        <svg
          class="copy-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <rect
            x="9"
            y="9"
            width="11"
            height="11"
            rx="2"
          ></rect>

          <path
            d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
          ></path>

        </svg>

        <span>Copy</span>

      `;

    };


  setCopyNormal();


  const codeElement =
    document.createElement("pre");

  codeElement.className =
    "code-content";

  codeElement.textContent =
    code;


  copyButton.addEventListener(
    "click",
    async () => {

      const copyText =
        codeElement.textContent;

      try{

        await navigator.clipboard.writeText(
          copyText
        );

      }catch{

        const textarea =
          document.createElement("textarea");

        textarea.value =
          copyText;

        textarea.style.position =
          "fixed";

        textarea.style.opacity =
          "0";

        document.body.appendChild(
          textarea
        );

        textarea.select();

        document.execCommand(
          "copy"
        );

        textarea.remove();

      }


      copyButton.classList.add(
        "copied"
      );

      copyButton.innerHTML = `

        <svg
          class="copy-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <path
            d="M20 6L9 17l-5-5"
          ></path>

        </svg>

        <span>Copied</span>

      `;


      setTimeout(
        setCopyNormal,
        1800
      );

    }
  );


  header.appendChild(
    languageLabel
  );

  header.appendChild(
    copyButton
  );


  wrapper.appendChild(
    header
  );

  wrapper.appendChild(
    codeElement
  );


  return wrapper;

}

  let match;


  while(
    (match = regex.exec(text)) !== null
  ){

    if(
      match.index > lastIndex
    ){

      parts.push({
        type:"text",
        content:
          text.slice(
            lastIndex,
            match.index
          )
      });

    }


    parts.push({
      type:"code",
      language:
        match[1] || "code",
      content:
        match[2]
          .replace(/^\n/,"")
          .replace(/\n$/,"")
    });


    lastIndex =
      regex.lastIndex;

  }


  if(
    lastIndex < text.length
  ){

    parts.push({
      type:"text",
      content:
        text.slice(lastIndex)
    });

  }


  return parts;

}


/* ==========================================================
   ANIMATE TEXT
========================================================== */

function animateText(
  container,
  text
){

  return new Promise(
    resolve => {

      if(!text){

        resolve();

        return;

      }


      const wrapper =
        document.createElement("div");

      wrapper.className =
        "ai-typewriter";


      const textNode =
        document.createTextNode("");

      const cursor =
        document.createElement("span");

      cursor.className =
        "ai-cursor";


      wrapper.appendChild(
        textNode
      );

      wrapper.appendChild(
        cursor
      );

      container.appendChild(
        wrapper
      );


      let index = 0;


      function typeNext(){

        if(index >= text.length){

          cursor.remove();

          resolve();

          return;

        }


        const char =
          text[index];

        textNode.nodeValue +=
          char;

        index++;


        if(
          char === "\n"
        ){

          scrollToBottom();

        }


        scrollToBottom();


        /*
          Kecepatan dibuat sedikit acak
          supaya terasa lebih natural.
        */

        let delay =
          12 +
          Math.random() * 10;


        if(
          char === "." ||
          char === "," ||
          char === "!" ||
          char === "?"
        ){

          delay += 35;

        }


        if(
          char === "\n"
        ){

          delay += 25;

        }


        setTimeout(
          typeNext,
          delay
        );

      }


      typeNext();

    }
  );

}


/* ==========================================================
   ANIMATE CODE
========================================================== */

function animateCodeBlock(
  container,
  code,
  language
){

  return new Promise(
    resolve => {

      const codeBlock =
        createCodeBlock(
          "",
          language
        );


      const codeElement =
        codeBlock.querySelector(
          ".code-content"
        );


      container.appendChild(
        codeBlock
      );


      let index = 0;


      function typeCode(){

        if(index >= code.length){

          resolve();

          return;

        }


        /*
          Untuk kode, beberapa karakter
          ditampilkan sekaligus agar
          tidak terlalu lambat.
        */

        const chunk =
          code.slice(
            index,
            index + 2
          );


        codeElement.textContent +=
          chunk;

        index +=
          chunk.length;


        scrollToBottom();


        setTimeout(
          typeCode,
          5
        );

      }


      typeCode();

    }
  );

}


/* ==========================================================
   ANIMATE AI RESPONSE
========================================================== */

async function animateAIResponse(
  bubble,
  text
){

  const cleaned =
    cleanAIResponse(
      text
    );


  const container =
    document.createElement("div");

  container.className =
    "ai-content";


  bubble.appendChild(
    container
  );


  const parts =
    parseResponseParts(
      cleaned
    );


  for(
    const part of parts
  ){

    if(
      part.type === "text"
    ){

      if(
        !part.content
      ){

        continue;

      }


      await animateText(
        container,
        part.content
      );

    }else{

      await animateCodeBlock(
        container,
        part.content,
        part.language
      );

    }

  }


  /*
    Setelah animasi selesai,
    render ulang bagian teks agar
    bullet, bold, dan inline code
    tetap rapi.
  */

  const finalContainer =
    renderAIResponse(
      cleaned
    );


  bubble.replaceChildren(
    finalContainer
  );


  scrollToBottom();

}


/* ==========================================================
   RENDER AI RESPONSE FINAL
========================================================== */

function renderAIResponse(
  text
){

  const cleaned =
    cleanAIResponse(
      text
    );


  const container =
    document.createElement("div");

  container.className =
    "ai-content";


  const parts =
    parseResponseParts(
      cleaned
    );


  parts.forEach(
    part => {

      if(
        part.type === "code"
      ){

        container.appendChild(
          createCodeBlock(
            part.content,
            part.language
          )
        );

        return;

      }


      const lines =
        part.content.split("\n");


      let currentParagraph = [];
      let currentList = null;
      let currentNumberedList = null;


      function flushParagraph(){

        if(
          currentParagraph.length === 0
        ){

          return;

        }


        const paragraph =
          document.createElement("div");

        paragraph.className =
          "ai-paragraph";


        currentParagraph.forEach(
          (line,index) => {

            if(index > 0){

              paragraph.appendChild(
                document.createElement("br")
              );

            }


            appendInlineText(
              paragraph,
              line
            );

          }
        );


        container.appendChild(
          paragraph
        );

        currentParagraph = [];

      }


      function flushList(){

        if(currentList){

          container.appendChild(
            currentList
          );

          currentList =
            null;

        }


        if(currentNumberedList){

          container.appendChild(
            currentNumberedList
          );

          currentNumberedList =
            null;

        }

      }


      lines.forEach(
        rawLine => {

          const line =
            rawLine.trim();


          if(!line){

            flushParagraph();
            flushList();

            return;

          }


          const bulletMatch =
            line.match(
              /^[-*•]\s+(.+)$/
            );


          if(bulletMatch){

            flushParagraph();


            if(!currentList){

              flushList();

              currentList =
                document.createElement("ul");

              currentList.className =
                "ai-list";

            }


            const li =
              document.createElement("li");


            appendInlineText(
              li,
              bulletMatch[1]
            );


            currentList.appendChild(
              li
            );

            return;

          }


          const numberedMatch =
            line.match(
              /^\d+[.)]\s+(.+)$/
            );


          if(numberedMatch){

            flushParagraph();


            if(!currentNumberedList){

              flushList();

              currentNumberedList =
                document.createElement("ol");

              currentNumberedList.className =
                "ai-numbered-list";

            }


            const li =
              document.createElement("li");


            appendInlineText(
              li,
              numberedMatch[1]
            );


            currentNumberedList.appendChild(
              li
            );

            return;

          }


          flushList();

          currentParagraph.push(
            line
          );

        }
      );


      flushParagraph();
      flushList();

    }
  );


  return container;

}

/* ==========================================================
   RESIZE IMAGE
========================================================== */

function resizeImage(
  file,
  maxSize,
  quality
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            () => {

              let width =
                img.width;

              let height =
                img.height;


              if(
                width > maxSize ||
                height > maxSize
              ){

                const scale =
                  Math.min(
                    maxSize / width,
                    maxSize / height
                  );


                width =
                  Math.round(
                    width * scale
                  );

                height =
                  Math.round(
                    height * scale
                  );

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* ==========================================================
   GENERATE IMAGE
========================================================== */

async function generateImage(
  prompt
){

  const response =
    await fetch(
      IMAGE_API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          prompt:prompt
        })

      }
    );


  const text =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        text
      );

  }catch{

    data =
      null;

  }


  if(!response.ok){

    const errorMessage =
      data?.error ||
      data?.message ||
      text ||
      `HTTP ${response.status}`;


    throw new Error(
      errorMessage
    );

  }


  let imageUrl =
    null;


  if(
    typeof data === "string"
  ){

    imageUrl =
      data;

  }else if(data){

    imageUrl =
      data.image ||
      data.image_url ||
      data.url ||
      data.result;


    if(
      data.result &&
      typeof data.result === "object"
    ){

      imageUrl =
        data.result.image ||
        data.result.image_url ||
        data.result.url ||
        data.result.b64_json ||
        imageUrl;

    }

  }


  if(
    imageUrl &&
    !imageUrl.startsWith("data:") &&
    !imageUrl.startsWith("http") &&
    imageUrl.length > 100
  ){

    imageUrl =
      "data:image/png;base64," +
      imageUrl;

  }


  if(!imageUrl){

    throw new Error(
      "Worker tidak mengembalikan gambar."
    );

  }


  return imageUrl;

}


/* ==========================================================
   SEND MESSAGE
========================================================== */

async function sendMessage(){

  if(isGenerating){

    return;

  }


  const text =
    messageInput.value.trim();


  if(
    !text &&
    !selectedImageData
  ){

    return;

  }


  removeWelcome();


  isGenerating =
    true;

  sendBtn.disabled =
    true;


  /* ========================================================
     IMAGE MODE
  ======================================================== */

  if(
    currentMode === "image"
  ){

    if(!text){

      isGenerating =
        false;

      sendBtn.disabled =
        false;

      return;

    }


    appendMessage(
      "user",
      text
    );


    messageInput.value =
      "";

    autoResize();


    showTyping();


    try{

      const imageUrl =
        await generateImage(
          text
        );


      hideTyping();


      appendGeneratedImageMessage(
        imageUrl,
        text
      );


    }catch(error){

      hideTyping();


      appendMessage(
        "ai",
        getCustomErrorMessage(
          error,
          "image"
        )
      );


      console.error(
        "Image generation error:",
        error
      );

    }


    isGenerating =
      false;

    sendBtn.disabled =
      false;

    return;

  }


  /* ========================================================
     CHAT / VISION
  ======================================================== */

  let userContent;


  if(
    selectedImageData
  ){

    userContent = [

      {
        type:"text",

        text:
          text ||
          "Analisis gambar ini dengan teliti. Jelaskan apa yang terlihat."
      },

      {
        type:"image_url",

        image_url:{
          url:
            selectedImageData
        }

      }

    ];

  }else{

    userContent =
      text;

  }


  appendMessage(
    "user",
    text ||
    "📷 Mengirim gambar..."
  );


  messages.push({
    role:"user",
    content:userContent
  });


  messageInput.value =
    "";

  autoResize();


  selectedImageData =
    null;

  selectedImageFile =
    null;

  previewImage.src =
    "";

  previewWrap.classList.remove(
    "show"
  );

  fileInput.value =
    "";


  showTyping();


  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            model:
              MODEL,

            messages:
              messages,

            max_tokens:
              MAX_TOKENS,

            temperature:
              0.75

          })

        }
      );


    const rawText =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(
          rawText
        );

    }catch{

      data =
        null;

    }


    if(!response.ok){

      const errorMessage =
        data?.error?.message ||
        data?.error ||
        data?.message ||
        rawText ||
        `HTTP ${response.status}`;


      throw new Error(
        errorMessage
      );

    }


    const reply =
      data?.choices?.[0]?.message?.content;


    if(!reply){

      throw new Error(
        "AI tidak mengembalikan jawaban."
      );

    }


    const cleanReply =
      cleanAIResponse(
        reply
      );


    hideTyping();


    /*
      Buat bubble AI terlebih dahulu,
      lalu jalankan animasi mengetik.
    */

    const row =
      document.createElement("div");

    row.className =
      "message-row ai";


    const bubble =
      document.createElement("div");

    bubble.className =
      "message ai";


    row.appendChild(
      bubble
    );

    chat.appendChild(
      row
    );


    /*
      Animasi harus selesai terlebih dahulu
      sebelum request berikutnya bisa dilakukan.
    */

    await animateAIResponse(
      bubble,
      cleanReply
    );


    messages.push({
      role:"assistant",
      content:
        cleanReply
    });


  }catch(error){

    hideTyping();


    appendMessage(
      "ai",
      getCustomErrorMessage(
        error,
        "chat"
      )
    );


    console.error(
      "SATXAI error:",
      error
    );

  }


  isGenerating =
    false;

  sendBtn.disabled =
    false;

}
