<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>SATXAI</title>

<style>
:root{
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --blue2:#3b82f6;
  --blue-soft:#eff6ff;
  --blue-light:#dbeafe;

  --bg:#f7faff;
  --surface:#ffffff;
  --surface-soft:#f8fbff;

  --ink:#0f172a;
  --ink-soft:#334155;
  --ink-mute:#64748b;

  --line:#e2e8f0;
  --line-blue:#bfdbfe;

  --danger:#ef4444;

  --shadow:0 10px 30px rgba(15,23,42,.06);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

body{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--ink);
}

button,
textarea,
input{
  font:inherit;
}

button{
  border:0;
  outline:0;
}

/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  height:100dvh;
  min-height:0;

  display:flex;
  flex-direction:column;

  background:
    radial-gradient(
      circle at 50% -20%,
      rgba(59,130,246,.09),
      transparent 42%
    ),
    var(--bg);
}

/* =========================================================
   INTRO
========================================================= */

.intro{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:#fff;

  transition:
    opacity .45s ease,
    visibility .45s ease;
}

.intro.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro-logo{
  width:64px;
  height:64px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:18px;

  background:var(--blue);
  color:#fff;

  font-size:26px;
  font-weight:800;

  box-shadow:
    0 14px 35px rgba(37,99,235,.20);

  animation:introFloat 1.2s ease-in-out infinite alternate;
}

.intro-title{
  margin-top:18px;

  font-size:22px;
  font-weight:800;
  letter-spacing:-.6px;
}

.intro-subtitle{
  margin-top:5px;

  color:var(--ink-mute);
  font-size:13px;
}

.intro-line{
  width:110px;
  height:3px;

  margin-top:22px;

  overflow:hidden;
  border-radius:999px;

  background:var(--blue-light);
}

.intro-line::after{
  content:"";

  display:block;

  width:45%;
  height:100%;

  border-radius:999px;

  background:var(--blue);

  animation:introLoading 1s ease-in-out infinite;
}

@keyframes introFloat{
  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-6px);
  }
}

@keyframes introLoading{
  0%{
    transform:translateX(-120%);
  }

  100%{
    transform:translateX(250%);
  }
}

/* =========================================================
   HEADER
========================================================= */

.header{
  flex:0 0 auto;

  width:100%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    max(14px, env(safe-area-inset-top))
    18px
    14px;

  background:rgba(255,255,255,.94);

  border-bottom:1px solid var(--line);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:var(--blue);
  color:#fff;

  font-size:17px;
  font-weight:800;

  box-shadow:
    0 7px 18px rgba(37,99,235,.18);
}

.brand-text{
  display:flex;
  flex-direction:column;
  gap:1px;
}

.brand-name{
  font-size:16px;
  font-weight:800;
  letter-spacing:-.3px;
}

.brand-status{
  display:flex;
  align-items:center;
  gap:5px;

  color:var(--ink-mute);
  font-size:11px;
}

.status-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:
    0 0 0 3px rgba(34,197,94,.10);
}

.header-badge{
  padding:7px 10px;

  border:1px solid var(--line-blue);
  border-radius:999px;

  background:var(--blue-soft);
  color:var(--blue);

  font-size:11px;
  font-weight:700;
}

/* =========================================================
   CHAT SCROLL
========================================================= */

.chat-scroll{
  flex:1 1 auto;

  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  scroll-behavior:smooth;

  padding:
    22px
    18px
    18px;
}

.chat-scroll::-webkit-scrollbar{
  width:5px;
}

.chat-scroll::-webkit-scrollbar-track{
  background:transparent;
}

.chat-scroll::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:999px;
}

.chat{
  width:100%;
  max-width:850px;

  margin:0 auto;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{
  min-height:100%;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  text-align:center;

  padding:
    35px
    10px
    45px;
}

.welcome-orb{
  width:76px;
  height:76px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:22px;

  background:#fff;

  border:1px solid var(--line-blue);

  color:var(--blue);

  box-shadow:
    0 15px 35px rgba(37,99,235,.08);
}

.welcome-orb span{
  font-size:30px;
  font-weight:900;
}

.welcome h1{
  margin:20px 0 7px;

  font-size:30px;
  line-height:1.1;
  letter-spacing:-1.2px;
}

.welcome p{
  max-width:480px;

  margin:0;

  color:var(--ink-mute);

  font-size:14px;
  line-height:1.6;
}

/* =========================================================
   SUGGESTIONS
========================================================= */

.suggestions{
  width:100%;
  max-width:700px;

  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));

  gap:10px;

  margin-top:28px;
}

.suggestion{
  padding:15px;

  text-align:left;

  border:1px solid var(--line);
  border-radius:14px;

  background:#fff;

  color:var(--ink);

  cursor:pointer;

  transition:
    border-color .2s ease,
    background .2s ease,
    transform .2s ease,
    box-shadow .2s ease;
}

.suggestion:hover{
  border-color:var(--line-blue);

  background:var(--blue-soft);

  box-shadow:
    0 8px 20px rgba(37,99,235,.06);

  transform:translateY(-1px);
}

.suggestion-title{
  font-size:13px;
  font-weight:750;
}

.suggestion-desc{
  margin-top:4px;

  color:var(--ink-mute);

  font-size:11px;
  line-height:1.4;
}

/* =========================================================
   MESSAGE
========================================================= */

.message-row{
  width:100%;

  display:flex;

  margin-bottom:18px;
}

.message-row.user{
  justify-content:flex-end;
}

.message-row.ai{
  justify-content:flex-start;
}

.message{
  width:auto;
  max-width:min(760px,88%);

  border-radius:17px;

  padding:12px 15px;

  font-size:14px;
  line-height:1.6;

  white-space:pre-wrap;
  word-break:break-word;
}

.message.user{
  background:var(--blue);

  color:#fff;

  border-bottom-right-radius:5px;

  box-shadow:
    0 8px 20px rgba(37,99,235,.14);
}

.message.ai{
  width:fit-content;

  background:#fff;

  color:var(--ink-soft);

  border:1px solid var(--line);

  border-bottom-left-radius:5px;

  box-shadow:
    0 5px 18px rgba(15,23,42,.035);
}

/* =========================================================
   TYPING INDICATOR
========================================================= */

/*
  Ini bagian yang diperbaiki.
  Bubble berpikir sekarang selalu kecil:
  58px x 42px.
*/

.message.ai.typing-message{
  width:58px;
  min-width:58px;
  max-width:58px;

  height:42px;
  min-height:42px;

  padding:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:14px;
  border-bottom-left-radius:5px;

  overflow:hidden;
}

.typing{
  width:58px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:4px;
}

.typing span{
  display:block;

  width:6px;
  height:6px;

  flex:0 0 6px;

  border-radius:50%;

  background:var(--blue);

  animation:typing .9s infinite ease-in-out;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.30s;
}

@keyframes typing{

  0%,
  60%,
  100%{
    transform:translateY(0);
    opacity:.3;
  }

  30%{
    transform:translateY(-4px);
    opacity:1;
  }

}

/* =========================================================
   GENERATED IMAGE
========================================================= */

.generated-image{
  width:100%;
  max-width:520px;

  display:block;

  border-radius:14px;

  border:1px solid var(--line);

  cursor:pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.generated-image:hover{
  transform:scale(1.01);

  box-shadow:
    0 12px 30px rgba(15,23,42,.10);
}

.image-message-label{
  margin-bottom:9px;

  color:var(--ink-mute);

  font-size:12px;
}

/* =========================================================
   COMPOSER WRAP
========================================================= */

.composer-wrap{
  flex:0 0 auto;

  width:100%;

  padding:
    8px
    16px
    max(14px, env(safe-area-inset-bottom));

  background:
    linear-gradient(
      to bottom,
      rgba(247,250,255,.65),
      rgba(247,250,255,1)
    );

  z-index:30;
}

/* =========================================================
   MODE BAR
========================================================= */

.mode-bar{
  width:100%;
  max-width:850px;

  margin:0 auto 7px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:5px;
}

.mode-btn{
  padding:6px 10px;

  border-radius:999px;

  background:transparent;

  color:var(--ink-mute);

  font-size:11px;
  font-weight:700;

  cursor:pointer;

  transition:.2s ease;
}

.mode-btn.active{
  background:var(--blue-soft);

  color:var(--blue);
}

/* =========================================================
   PREVIEW
========================================================= */

.preview-wrap{
  display:none;

  width:100%;
  max-width:850px;

  margin:0 auto 7px;
}

.preview-wrap.show{
  display:flex;
}

.preview{
  position:relative;

  width:70px;
  height:70px;
}

.preview img{
  width:70px;
  height:70px;

  object-fit:cover;

  border-radius:12px;

  border:1px solid var(--line-blue);
}

.preview-remove{
  position:absolute;

  top:-7px;
  right:-7px;

  width:22px;
  height:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#fff;

  border:1px solid var(--line);

  color:var(--danger);

  font-size:14px;

  cursor:pointer;

  box-shadow:
    0 3px 10px rgba(0,0,0,.10);
}

/* =========================================================
   COMPOSER
========================================================= */

.composer{
  width:100%;
  max-width:850px;

  margin:0 auto;

  display:flex;
  align-items:flex-end;

  gap:8px;

  padding:8px;

  background:#fff;

  border:1px solid var(--line);

  border-radius:18px;

  box-shadow:
    0 10px 30px rgba(15,23,42,.07);

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.composer:focus-within{
  border-color:var(--line-blue);

  box-shadow:
    0 10px 30px rgba(37,99,235,.09);
}

/* =========================================================
   TOOL BUTTON
========================================================= */

.tool-btn{
  flex:0 0 40px;

  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:#f8fafc;

  border:1px solid var(--line);

  color:var(--ink-soft);

  cursor:pointer;

  transition:
    background .2s ease,
    color .2s ease,
    border-color .2s ease;
}

.tool-btn:hover{
  background:var(--blue-soft);

  border-color:var(--line-blue);

  color:var(--blue);
}

.tool-btn svg{
  width:19px;
  height:19px;
}

/* =========================================================
   INPUT
========================================================= */

.input-area{
  flex:1;

  min-width:0;
}

textarea{
  width:100%;

  min-height:40px;
  max-height:130px;

  display:block;

  resize:none;

  padding:10px 4px;

  border:0;
  outline:0;

  background:transparent;

  color:var(--ink);

  font-size:14px;

  line-height:20px;
}

textarea::placeholder{
  color:#94a3b8;
}

/* =========================================================
   SEND
========================================================= */

.send-btn{
  flex:0 0 40px;

  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:var(--blue);

  color:#fff;

  cursor:pointer;

  box-shadow:
    0 7px 17px rgba(37,99,235,.18);

  transition:
    background .2s ease,
    transform .15s ease,
    opacity .2s ease;
}

.send-btn:hover{
  background:var(--blue-dark);
}

.send-btn:active{
  transform:scale(.94);
}

.send-btn:disabled{
  opacity:.45;

  cursor:not-allowed;

  box-shadow:none;
}

.send-btn svg{
  width:19px;
  height:19px;
}

/* =========================================================
   IMAGE MODAL
========================================================= */

.image-modal{
  position:fixed;
  inset:0;

  z-index:99999;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(15,23,42,.82);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.image-modal.show{
  display:flex;
}

.modal-box{
  position:relative;

  width:min(900px,100%);

  max-height:92vh;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  border-radius:20px;

  background:#fff;

  box-shadow:
    0 25px 70px rgba(0,0,0,.30);
}

.modal-image-wrap{
  flex:1;

  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:12px;

  background:#f8fafc;
}

.modal-box img{
  display:block;

  max-width:100%;
  max-height:75vh;

  object-fit:contain;

  border-radius:12px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;

  gap:8px;

  padding:12px;

  border-top:1px solid var(--line);
}

.modal-btn{
  padding:9px 14px;

  border-radius:10px;

  background:var(--blue);

  color:#fff;

  font-size:12px;
  font-weight:700;

  cursor:pointer;
}

.modal-btn.secondary{
  background:#f1f5f9;

  color:var(--ink-soft);

  border:1px solid var(--line);
}

.modal-close{
  position:absolute;

  top:10px;
  right:10px;

  z-index:2;

  width:34px;
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:rgba(255,255,255,.92);

  color:var(--ink);

  border:1px solid var(--line);

  cursor:pointer;

  box-shadow:
    0 5px 15px rgba(0,0,0,.10);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

  .header{
    padding-left:13px;
    padding-right:13px;
  }

  .header-badge{
    display:none;
  }

  .chat-scroll{
    padding:
      16px
      12px
      14px;
  }

  .welcome{
    padding:
      25px
      5px
      35px;
  }

  .welcome h1{
    font-size:27px;
  }

  .suggestions{
    grid-template-columns:1fr;

    gap:8px;
  }

  .message{
    max-width:92%;

    font-size:13.5px;
  }

  .message.ai.typing-message{
    width:58px;
    min-width:58px;
    max-width:58px;
  }

  .composer-wrap{
    padding-left:9px;
    padding-right:9px;
  }

  .composer{
    border-radius:16px;
  }

}

/* =========================================================
   SMALL HEIGHT
========================================================= */

@media(max-height:600px){

  .welcome-orb{
    width:60px;
    height:60px;
  }

  .welcome h1{
    margin-top:13px;

    font-size:24px;
  }

  .welcome p{
    font-size:12px;
  }

  .suggestions{
    margin-top:17px;
  }

}
</style>
</head>

<body>

<!-- =======================================================
     INTRO
======================================================= -->

<div class="intro" id="intro">

  <div class="intro-logo">
    S
  </div>

  <div class="intro-title">
    SATXAI
  </div>

  <div class="intro-subtitle">
    Personal AI Assistant
  </div>

  <div class="intro-line"></div>

</div>


<div class="app">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <div class="brand">

      <div class="brand-logo">
        S
      </div>

      <div class="brand-text">

        <div class="brand-name">
          SATXAI
        </div>

        <div class="brand-status">

          <span class="status-dot"></span>

          Online

        </div>

      </div>

    </div>

    <div class="header-badge">
      AI Assistant
    </div>

  </header>


  <!-- =====================================================
       CHAT
  ====================================================== -->

  <main class="chat-scroll" id="chatScroll">

    <div class="chat" id="chat">

      <section class="welcome" id="welcome">

        <div class="welcome-orb">
          <span>S</span>
        </div>

        <h1>
          Halo, saya SATXAI
        </h1>

        <p>
          Asisten AI pribadi untuk membantu menjawab pertanyaan,
          menganalisis gambar, dan membuat gambar dari prompt.
        </p>


        <div class="suggestions">

          <button
            class="suggestion"
            data-prompt="Jelaskan apa yang bisa kamu bantu."
          >

            <div class="suggestion-title">
              💡 Apa yang bisa kamu lakukan?
            </div>

            <div class="suggestion-desc">
              Lihat kemampuan SATXAI.
            </div>

          </button>


          <button
            class="suggestion"
            data-prompt="Bantu saya membuat website sederhana."
          >

            <div class="suggestion-title">
              💻 Buat website
            </div>

            <div class="suggestion-desc">
              Mulai membuat project website.
            </div>

          </button>


          <button
            class="suggestion"
            data-prompt="Jelaskan konsep JavaScript untuk pemula."
          >

            <div class="suggestion-title">
              📚 Belajar coding
            </div>

            <div class="suggestion-desc">
              Penjelasan sederhana dan mudah dipahami.
            </div>

          </button>


          <button
            class="suggestion"
            data-prompt="Berikan saya ide project Arduino yang menarik."
          >

            <div class="suggestion-title">
              🤖 Ide project
            </div>

            <div class="suggestion-desc">
              Cari inspirasi project teknologi.
            </div>

          </button>

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       COMPOSER
  ====================================================== -->

  <div class="composer-wrap">

    <div class="mode-bar">

      <button
        class="mode-btn active"
        id="chatModeBtn"
        type="button"
      >
        Chat
      </button>

      <button
        class="mode-btn"
        id="imageModeBtn"
        type="button"
      >
        Buat Gambar
      </button>

    </div>


    <div
      class="preview-wrap"
      id="previewWrap"
    >

      <div class="preview">

        <img
          id="previewImage"
          alt="Preview"
        >

        <button
          class="preview-remove"
          id="removeImageBtn"
          type="button"
        >
          ×
        </button>

      </div>

    </div>


    <div class="composer">

      <button
        class="tool-btn"
        id="uploadBtn"
        type="button"
        aria-label="Upload gambar"
        title="Upload gambar"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="3"
          ></rect>

          <circle
            cx="8.5"
            cy="8.5"
            r="1.5"
          ></circle>

          <path
            d="M21 15l-5-5L5 21"
          ></path>

        </svg>

      </button>


      <input
        type="file"
        id="fileInput"
        accept="image/*"
        hidden
      >


      <div class="input-area">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Tulis pesan..."
          autocomplete="off"
          spellcheck="true"
        ></textarea>

      </div>


      <button
        class="send-btn"
        id="sendBtn"
        type="button"
        aria-label="Kirim"
        title="Kirim"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <path d="M22 2L11 13"></path>

          <path
            d="M22 2L15 22L11 13L2 9L22 2Z"
          ></path>

        </svg>

      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     IMAGE MODAL
======================================================= -->

<div
  class="image-modal"
  id="imageModal"
>

  <div class="modal-box">

    <button
      class="modal-close"
      id="modalClose"
      type="button"
    >
      ×
    </button>

    <div class="modal-image-wrap">

      <img
        id="modalImage"
        src=""
        alt="Generated image"
      >

    </div>

    <div class="modal-actions">

      <button
        class="modal-btn secondary"
        id="modalCloseBottom"
        type="button"
      >
        Tutup
      </button>

      <button
        class="modal-btn"
        id="modalDownload"
        type="button"
      >
        Simpan Gambar
      </button>

    </div>

  </div>

</div>


<script>
/* =========================================================
   CONFIG
========================================================= */

const API_URL =
  "https://satria-proxy.satxbase.workers.dev/";

const IMAGE_API_URL =
  "https://satria-proxy.satxbase.workers.dev/generate-image";

const MODEL =
  "qwen/qwen3.8-27b";

/*
===========================================================
BATAS OUTPUT

Groq kamu:
Limit = 1000 OTPM

Kita gunakan:
900 token

Jadi:
900 < 1000
===========================================================
*/

const MAX_TOKENS = 900;


const SYSTEM_PROMPT =
  "Kamu adalah SATXAI, asisten AI pribadi yang ramah, pintar, dan selalu siap membantu. " +
  "Kamu berbicara dalam Bahasa Indonesia dengan santai dan bersahabat. " +
  "Kamu dibuat oleh Satria. " +
  "Jika pengguna mengirim gambar, analisis gambar tersebut dengan teliti berdasarkan apa yang benar-benar terlihat. " +
  "Jangan mengarang detail yang tidak terlihat pada gambar.";


/* =========================================================
   ELEMENTS
========================================================= */

const intro =
  document.getElementById("intro");

const chatScroll =
  document.getElementById("chatScroll");

const chat =
  document.getElementById("chat");

const welcome =
  document.getElementById("welcome");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const uploadBtn =
  document.getElementById("uploadBtn");

const fileInput =
  document.getElementById("fileInput");

const previewWrap =
  document.getElementById("previewWrap");

const previewImage =
  document.getElementById("previewImage");

const removeImageBtn =
  document.getElementById("removeImageBtn");

const chatModeBtn =
  document.getElementById("chatModeBtn");

const imageModeBtn =
  document.getElementById("imageModeBtn");

const imageModal =
  document.getElementById("imageModal");

const modalImage =
  document.getElementById("modalImage");

const modalClose =
  document.getElementById("modalClose");

const modalCloseBottom =
  document.getElementById("modalCloseBottom");

const modalDownload =
  document.getElementById("modalDownload");


/* =========================================================
   STATE
========================================================= */

let currentMode =
  "chat";

let selectedImageData =
  null;

let selectedImageFile =
  null;

let isGenerating =
  false;

let currentModalImage =
  "";


/* =========================================================
   MESSAGE HISTORY
========================================================= */

let messages = [
  {
    role:"system",
    content:SYSTEM_PROMPT
  }
];


/* =========================================================
   INTRO
========================================================= */

setTimeout(() => {

  intro.classList.add("hide");

}, 1400);


/* =========================================================
   VIEWPORT
========================================================= */

function updateViewportHeight(){

  if(!window.visualViewport){
    return;
  }

  document.documentElement.style.setProperty(
    "--visual-height",
    `${window.visualViewport.height}px`
  );

}

if(window.visualViewport){

  window.visualViewport.addEventListener(
    "resize",
    updateViewportHeight
  );

  window.visualViewport.addEventListener(
    "scroll",
    updateViewportHeight
  );

}

updateViewportHeight();


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom(){

  requestAnimationFrame(() => {

    chatScroll.scrollTop =
      chatScroll.scrollHeight;

  });

}


/* =========================================================
   REMOVE WELCOME
========================================================= */

function removeWelcome(){

  const element =
    document.getElementById("welcome");

  if(element){

    element.remove();

  }

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function appendMessage(
  role,
  text
){

  const row =
    document.createElement("div");

  row.className =
    "message-row " +
    (role === "user"
      ? "user"
      : "ai");


  const bubble =
    document.createElement("div");

  bubble.className =
    "message " +
    (role === "user"
      ? "user"
      : "ai");


  bubble.textContent =
    text;


  row.appendChild(
    bubble
  );

  chat.appendChild(
    row
  );

  scrollToBottom();

  return bubble;

}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function showTyping(){

  const row =
    document.createElement("div");

  row.className =
    "message-row ai";

  row.id =
    "typingRow";


  const bubble =
    document.createElement("div");

  /*
   Class khusus supaya CSS
   tidak membuat bubble menjadi panjang.
  */

  bubble.className =
    "message ai typing-message";


  bubble.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;


  row.appendChild(
    bubble
  );

  chat.appendChild(
    row
  );

  scrollToBottom();

}


function hideTyping(){

  const typing =
    document.getElementById(
      "typingRow"
    );

  if(typing){

    typing.remove();

  }

}


/* =========================================================
   GENERATED IMAGE MESSAGE
========================================================= */

function appendGeneratedImageMessage(
  imageUrl,
  prompt
){

  const row =
    document.createElement("div");

  row.className =
    "message-row ai";


  const bubble =
    document.createElement("div");

  bubble.className =
    "message ai";


  const label =
    document.createElement("div");

  label.className =
    "image-message-label";

  label.textContent =
    "Gambar berhasil dibuat";


  const img =
    document.createElement("img");

  img.className =
    "generated-image";

  img.src =
    imageUrl;

  img.alt =
    prompt ||
    "Generated image";

  img.loading =
    "lazy";


  img.addEventListener(
    "click",
    () => {

      openImageModal(
        imageUrl
      );

    }
  );


  bubble.appendChild(
    label
  );

  bubble.appendChild(
    img
  );

  row.appendChild(
    bubble
  );

  chat.appendChild(
    row
  );

  scrollToBottom();

}


/* =========================================================
   IMAGE MODAL
========================================================= */

function openImageModal(
  imageUrl
){

  currentModalImage =
    imageUrl;

  modalImage.src =
    imageUrl;

  imageModal.classList.add(
    "show"
  );

}


function closeImageModal(){

  imageModal.classList.remove(
    "show"
  );

}


modalClose.addEventListener(
  "click",
  closeImageModal
);


modalCloseBottom.addEventListener(
  "click",
  closeImageModal
);


imageModal.addEventListener(
  "click",
  event => {

    if(
      event.target === imageModal
    ){

      closeImageModal();

    }

  }
);


/* =========================================================
   DOWNLOAD IMAGE
========================================================= */

modalDownload.addEventListener(
  "click",
  async () => {

    if(!currentModalImage){
      return;
    }

    try{

      const response =
        await fetch(
          currentModalImage
        );

      const blob =
        await response.blob();

      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );

      link.href =
        url;

      link.download =
        "SATXAI-generated.png";

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

      URL.revokeObjectURL(
        url
      );

    }catch(error){

      window.open(
        currentModalImage,
        "_blank"
      );

    }

  }
);


/* =========================================================
   MODE
========================================================= */

function setMode(
  mode
){

  currentMode =
    mode;


  if(mode === "image"){

    imageModeBtn.classList.add(
      "active"
    );

    chatModeBtn.classList.remove(
      "active"
    );

    uploadBtn.style.display =
      "none";

    messageInput.placeholder =
      "Deskripsikan gambar yang ingin dibuat...";

  }else{

    chatModeBtn.classList.add(
      "active"
    );

    imageModeBtn.classList.remove(
      "active"
    );

    uploadBtn.style.display =
      "flex";

    messageInput.placeholder =
      "Tulis pesan...";

  }

}


chatModeBtn.addEventListener(
  "click",
  () => {

    setMode(
      "chat"
    );

  }
);


imageModeBtn.addEventListener(
  "click",
  () => {

    setMode(
      "image"
    );

  }
);


/* =========================================================
   FILE UPLOAD
========================================================= */

uploadBtn.addEventListener(
  "click",
  () => {

    fileInput.click();

  }
);


fileInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files?.[0];


    if(!file){
      return;
    }


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      alert(
        "File yang dipilih harus berupa gambar."
      );

      return;

    }


    try{

      const compressed =
        await resizeImage(
          file,
          1600,
          0.82
        );


      selectedImageFile =
        file;

      selectedImageData =
        compressed;


      previewImage.src =
        compressed;

      previewWrap.classList.add(
        "show"
      );

    }catch(error){

      console.error(
        error
      );

      alert(
        "Gagal memproses gambar."
      );

    }

  }
);


/* =========================================================
   REMOVE IMAGE
========================================================= */

removeImageBtn.addEventListener(
  "click",
  () => {

    selectedImageData =
      null;

    selectedImageFile =
      null;

    previewImage.src =
      "";

    previewWrap.classList.remove(
      "show"
    );

    fileInput.value =
      "";

  }
);


/* =========================================================
   RESIZE IMAGE
========================================================= */

function resizeImage(
  file,
  maxSize,
  quality
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            () => {

              let width =
                img.width;

              let height =
                img.height;


              if(
                width > maxSize ||
                height > maxSize
              ){

                const scale =
                  Math.min(
                    maxSize / width,
                    maxSize / height
                  );


                width =
                  Math.round(
                    width * scale
                  );

                height =
                  Math.round(
                    height * scale
                  );

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   TEXTAREA AUTO RESIZE
========================================================= */

function autoResize(){

  messageInput.style.height =
    "auto";


  const height =
    Math.min(
      messageInput.scrollHeight,
      130
    );


  messageInput.style.height =
    `${height}px`;

}


messageInput.addEventListener(
  "input",
  autoResize
);


/* =========================================================
   SUGGESTIONS
========================================================= */

document
  .querySelectorAll(
    ".suggestion"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const prompt =
            button.dataset.prompt;


          messageInput.value =
            prompt;


          autoResize();

          sendMessage();

        }
      );

    }
  );


/* =========================================================
   GENERATE IMAGE
========================================================= */

async function generateImage(
  prompt
){

  const response =
    await fetch(
      IMAGE_API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          prompt:prompt
        })
      }
    );


  const text =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        text
      );

  }catch{

    data =
      null;

  }


  if(!response.ok){

    const errorMessage =
      data?.error ||
      data?.message ||
      text ||
      `HTTP ${response.status}`;


    throw new Error(
      errorMessage
    );

  }


  let imageUrl =
    null;


  if(
    typeof data === "string"
  ){

    imageUrl =
      data;

  }else if(data){

    imageUrl =
      data.image ||
      data.image_url ||
      data.url ||
      data.result;


    if(
      data.result &&
      typeof data.result === "object"
    ){

      imageUrl =
        data.result.image ||
        data.result.image_url ||
        data.result.url ||
        data.result.b64_json ||
        imageUrl;

    }

  }


  /*
   Jika hasil berupa base64
  */

  if(
    imageUrl &&
    !imageUrl.startsWith(
      "data:"
    ) &&
    !imageUrl.startsWith(
      "http"
    ) &&
    imageUrl.length > 100
  ){

    imageUrl =
      "data:image/png;base64," +
      imageUrl;

  }


  if(!imageUrl){

    throw new Error(
      "Worker tidak mengembalikan gambar."
    );

  }


  return imageUrl;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(isGenerating){
    return;
  }


  const text =
    messageInput.value.trim();


  if(
    !text &&
    !selectedImageData
  ){

    return;

  }


  removeWelcome();


  isGenerating =
    true;

  sendBtn.disabled =
    true;


  /* =======================================================
     IMAGE MODE
  ======================================================= */

  if(
    currentMode === "image"
  ){

    if(!text){

      isGenerating =
        false;

      sendBtn.disabled =
        false;

      return;

    }


    appendMessage(
      "user",
      text
    );


    messageInput.value =
      "";

    autoResize();


    showTyping();


    try{

      const imageUrl =
        await generateImage(
          text
        );


      hideTyping();


      appendGeneratedImageMessage(
        imageUrl,
        text
      );

    }catch(error){

      hideTyping();


      appendMessage(
        "ai",
        "⚠️ Terjadi kesalahan: " +
        error.message
      );


      console.error(
        "Image generation error:",
        error
      );

    }


    isGenerating =
      false;

    sendBtn.disabled =
      false;

    return;

  }


  /* =======================================================
     CHAT MODE
  ======================================================= */

  let userContent;


  if(
    selectedImageData
  ){

    userContent = [

      {
        type:"text",

        text:
          text ||
          "Analisis gambar ini dengan teliti. Jelaskan apa yang terlihat."
      },

      {
        type:"image_url",

        image_url:{
          url:selectedImageData
        }
      }

    ];

  }else{

    userContent =
      text;

  }


  appendMessage(
    "user",
    text ||
    "📷 Mengirim gambar..."
  );


  messages.push({

    role:"user",

    content:userContent

  });


  messageInput.value =
    "";

  autoResize();


  selectedImageData =
    null;

  selectedImageFile =
    null;

  previewImage.src =
    "";

  previewWrap.classList.remove(
    "show"
  );

  fileInput.value =
    "";


  showTyping();


  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            model:MODEL,

            messages:messages,

            /*
             =============================================
             FIX OTPM
             =============================================

             1024 ❌
             900  ✅

             Limit = 1000
             =============================================
            */

            max_tokens:MAX_TOKENS,

            temperature:0.7

          })

        }
      );


    const rawText =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(
          rawText
        );

    }catch{

      data =
        null;

    }


    if(!response.ok){

      const errorMessage =
        data?.error?.message ||
        data?.error ||
        data?.message ||
        rawText ||
        `HTTP ${response.status}`;


      throw new Error(
        errorMessage
      );

    }


    const reply =
      data?.choices?.[0]?.message?.content;


    if(!reply){

      throw new Error(
        "AI tidak mengembalikan jawaban."
      );

    }


    hideTyping();


    appendMessage(
      "ai",
      reply
    );


    messages.push({

      role:"assistant",

      content:reply

    });


  }catch(error){

    hideTyping();


    appendMessage(
      "ai",
      "⚠️ Terjadi kesalahan: " +
      error.message
    );


    console.error(
      "SATXAI error:",
      error
    );

  }


  isGenerating =
    false;

  sendBtn.disabled =
    false;

}


/* =========================================================
   SEND BUTTON
========================================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================================
   ENTER
========================================================= */

messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      closeImageModal();

    }

  }
);


/* =========================================================
   ANTI ZOOM
========================================================= */

document.addEventListener(
  "gesturestart",
  event => {

    event.preventDefault();

  },
  {
    passive:false
  }
);


document.addEventListener(
  "gesturechange",
  event => {

    event.preventDefault();

  },
  {
    passive:false
  }
);


document.addEventListener(
  "gestureend",
  event => {

    event.preventDefault();

  },
  {
    passive:false
  }
);


/* =========================================================
   INITIAL
========================================================= */

setMode(
  "chat"
);

autoResize();

</script>
