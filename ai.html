<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>
<title>SATXAI</title>

<style>
:root{
  --bg:#0e0e10;
  --surface:#17171b;
  --surface-2:#1c1c21;
  --surface-3:#141417;
  --line:#26262c;
  --line-soft:#1e1e23;

  --ink:#ececee;
  --ink-soft:#c8c8ce;
  --ink-mute:#8a8a92;

  --accent:#4f8cff;
  --accent-hover:#3b7cf0;
  --accent-soft:rgba(79,140,255,.12);
  --accent-line:rgba(79,140,255,.32);

  --danger:#f87171;
  --success:#4ade80;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html, body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

body{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

button, textarea, input{ font:inherit; }
button{ border:0; outline:0; background:none; cursor:pointer; }

/* =========================================================
   APP
========================================================= */

.app{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

/* =========================================================
   INTRO
========================================================= */

.intro{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:var(--bg);
  transition:opacity .35s ease, visibility .35s ease;
}

.intro.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro-logo{
  width:54px;
  height:54px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  font-size:22px;
  font-weight:800;
}

.intro-title{
  margin-top:16px;
  font-size:18px;
  font-weight:700;
  letter-spacing:-.3px;
  color:var(--ink);
}

.intro-subtitle{
  margin-top:4px;
  color:var(--ink-mute);
  font-size:12px;
}

.intro-line{
  width:100px;
  height:2px;
  margin-top:20px;
  overflow:hidden;
  border-radius:999px;
  background:var(--line);
}

.intro-line::after{
  content:"";
  display:block;
  width:40%;
  height:100%;
  border-radius:999px;
  background:var(--accent);
  animation:introLoading 1s ease-in-out infinite;
}

@keyframes introLoading{
  0%{ transform:translateX(-120%); }
  100%{ transform:translateX(280%); }
}

/* =========================================================
   HEADER
========================================================= */

.header{
  position:relative;
  flex:0 0 auto;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:
    max(14px, env(safe-area-inset-top))
    18px
    14px;
  background:var(--bg);
  border-bottom:1px solid var(--line-soft);
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:var(--accent);
  color:#fff;
  font-size:15px;
  font-weight:800;
}

.brand-text{
  display:flex;
  flex-direction:column;
  gap:1px;
}

.brand-name{
  font-size:15px;
  font-weight:700;
  letter-spacing:-.2px;
  color:var(--ink);
}

.brand-status{
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--ink-mute);
  font-size:11px;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--success);
}

.header-badge{
  padding:5px 10px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--ink-mute);
  font-size:11px;
  font-weight:600;
  letter-spacing:.2px;
}

/* =========================================================
   CHAT SCROLL
========================================================= */

.chat-scroll{
  position:relative;
  z-index:1;
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-behavior:smooth;
  padding:22px 18px 16px;
}

.chat-scroll::-webkit-scrollbar{ width:5px; }
.chat-scroll::-webkit-scrollbar-track{ background:transparent; }
.chat-scroll::-webkit-scrollbar-thumb{
  background:#2b2b31;
  border-radius:999px;
}

.chat{
  width:100%;
  max-width:820px;
  margin:0 auto;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:30px 8px 40px;
}

.welcome-orb{
  width:60px;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--accent);
}

.welcome-orb span{
  font-size:24px;
  font-weight:800;
}

.welcome h1{
  margin:18px 0 6px;
  font-size:26px;
  line-height:1.15;
  letter-spacing:-.8px;
  color:var(--ink);
  font-weight:700;
}

.welcome p{
  max-width:460px;
  margin:0;
  color:var(--ink-mute);
  font-size:13.5px;
  line-height:1.6;
}

.suggestions{
  width:100%;
  max-width:640px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-top:24px;
}

.suggestion{
  padding:13px 14px;
  text-align:left;
  border:1px solid var(--line-soft);
  border-radius:12px;
  background:var(--surface-3);
  color:var(--ink);
  cursor:pointer;
  transition:border-color .18s ease, background .18s ease;
}

.suggestion:hover{
  border-color:var(--line);
  background:var(--surface);
}

.suggestion-title{
  font-size:13px;
  font-weight:600;
}

.suggestion-desc{
  margin-top:3px;
  color:var(--ink-mute);
  font-size:11.5px;
  line-height:1.4;
}

/* =========================================================
   MESSAGE
========================================================= */

.message-row{
  width:100%;
  display:flex;
  margin-bottom:16px;
}

.message-row.user{ justify-content:flex-end; }
.message-row.ai{ justify-content:flex-start; }

.message{
  width:auto;
  max-width:min(760px,92%);
  border-radius:14px;
  padding:11px 15px;
  font-size:14px;
  line-height:1.65;
  word-break:break-word;
}

.message.user{
  white-space:pre-wrap;
  background:var(--accent);
  color:#fff;
  border-bottom-right-radius:4px;
}

.message.ai{
  width:auto;
  background:var(--surface);
  color:var(--ink-soft);
  border:1px solid var(--line-soft);
  border-bottom-left-radius:4px;
  padding:13px 16px;
  overflow:hidden;
}

/* =========================================================
   AI TEXT
========================================================= */

.ai-content{ width:100%; }

.ai-paragraph{ margin:0 0 10px; }
.ai-paragraph:last-child{ margin-bottom:0; }

.ai-line{ margin:0 0 7px; }
.ai-line:last-child{ margin-bottom:0; }

.ai-list{
  margin:6px 0 10px;
  padding-left:20px;
}

.ai-list li{ margin-bottom:4px; }

.ai-numbered-list{
  margin:6px 0 10px;
  padding-left:22px;
}

.ai-numbered-list li{ margin-bottom:4px; }

.ai-strong{
  font-weight:650;
  color:var(--ink);
}

.ai-inline-code{
  padding:2px 6px;
  border-radius:6px;
  background:var(--surface-2);
  border:1px solid var(--line);
  color:#bfdbfe;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:.88em;
}

/* =========================================================
   TYPEWRITER
========================================================= */

.ai-typewriter{
  white-space:pre-wrap;
  word-break:break-word;
}

.ai-cursor{
  display:inline-block;
  width:2px;
  height:16px;
  margin-left:2px;
  vertical-align:-3px;
  border-radius:2px;
  background:var(--accent);
  animation:cursorBlink .8s ease-in-out infinite;
}

@keyframes cursorBlink{
  0%,45%{ opacity:1; }
  50%,100%{ opacity:0; }
}

/* =========================================================
   CODE BLOCK
========================================================= */

.code-block{
  position:relative;
  width:100%;
  margin:11px 0;
  overflow:hidden;
  border-radius:10px;
  background:var(--surface-3);
  border:1px solid var(--line);
}

.code-block:last-child{ margin-bottom:0; }

.code-header{
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 9px 6px 13px;
  background:var(--surface);
  border-bottom:1px solid var(--line-soft);
}

.code-language{
  color:var(--ink-mute);
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.copy-code-btn{
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 9px;
  border-radius:7px;
  background:var(--surface-2);
  color:var(--ink-soft);
  border:1px solid var(--line);
  font-size:10px;
  font-weight:700;
  cursor:pointer;
  transition:background .18s ease, color .18s ease;
}

.copy-code-btn:hover{
  background:#23232a;
  color:#fff;
}

.copy-code-btn:active{ transform:scale(.96); }

.copy-code-btn.copied{
  background:#14532d;
  color:#dcfce7;
  border-color:#14532d;
}

.copy-icon{ width:13px; height:13px; flex:0 0 13px; }

.code-content{
  width:100%;
  margin:0;
  padding:14px;
  overflow-x:auto;
  color:#e2e8f0;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  font-size:12.5px;
  line-height:1.65;
  white-space:pre;
  tab-size:2;
}

.code-content::-webkit-scrollbar{ height:5px; }
.code-content::-webkit-scrollbar-thumb{
  background:#2b2b31;
  border-radius:999px;
}

/* =========================================================
   TYPING DOTS
========================================================= */

.message.ai.typing-message{
  width:56px;
  min-width:56px;
  max-width:56px;
  height:40px;
  min-height:40px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  border-bottom-left-radius:4px;
  overflow:hidden;
}

.typing{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.typing span{
  display:block;
  width:6px;
  height:6px;
  flex:0 0 6px;
  border-radius:50%;
  background:var(--ink-mute);
  animation:typing .9s infinite ease-in-out;
}

.typing span:nth-child(2){ animation-delay:.15s; }
.typing span:nth-child(3){ animation-delay:.30s; }

@keyframes typing{
  0%,60%,100%{ transform:translateY(0); opacity:.3; }
  30%{ transform:translateY(-4px); opacity:1; }
}

/* =========================================================
   GENERATED IMAGE
========================================================= */

.generated-image{
  width:100%;
  max-width:520px;
  display:block;
  border-radius:12px;
  border:1px solid var(--line);
  cursor:pointer;
  transition:opacity .2s ease;
}

.generated-image:hover{ opacity:.92; }

.image-message-label{
  margin-bottom:8px;
  color:var(--ink-mute);
  font-size:12px;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-wrap{
  position:relative;
  flex:0 0 auto;
  width:100%;
  padding:
    8px
    16px
    max(14px, env(safe-area-inset-bottom));
  background:var(--bg);
  z-index:30;
}

.mode-bar{
  width:100%;
  max-width:820px;
  margin:0 auto 7px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.mode-btn{
  padding:6px 12px;
  border-radius:999px;
  background:transparent;
  color:var(--ink-mute);
  font-size:11.5px;
  font-weight:600;
  cursor:pointer;
  transition:background .18s ease, color .18s ease;
}

.mode-btn:hover{ color:var(--ink-soft); }

.mode-btn.active{
  background:var(--accent-soft);
  color:var(--accent);
}

.preview-wrap{
  display:none;
  width:100%;
  max-width:820px;
  margin:0 auto 7px;
}

.preview-wrap.show{ display:flex; }

.preview{
  position:relative;
  width:64px;
  height:64px;
}

.preview img{
  width:64px;
  height:64px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--line);
}

.preview-remove{
  position:absolute;
  top:-6px;
  right:-6px;
  width:20px;
  height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--danger);
  font-size:13px;
  line-height:1;
  cursor:pointer;
}

.composer{
  width:100%;
  max-width:820px;
  margin:0 auto;
  display:flex;
  align-items:flex-end;
  gap:6px;
  padding:6px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  transition:border-color .2s ease;
}

.composer:focus-within{
  border-color:var(--accent-line);
}

.tool-btn{
  flex:0 0 38px;
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:transparent;
  color:var(--ink-mute);
  cursor:pointer;
  transition:background .18s ease, color .18s ease;
}

.tool-btn:hover{
  background:var(--surface-2);
  color:var(--accent);
}

.tool-btn svg{ width:18px; height:18px; }

.input-area{
  flex:1;
  min-width:0;
}

textarea{
  width:100%;
  min-height:38px;
  max-height:130px;
  display:block;
  resize:none;
  padding:9px 4px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--ink);
  font-size:14px;
  line-height:20px;
}

textarea::placeholder{ color:#5e5e66; }

.send-btn{
  flex:0 0 38px;
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  transition:background .18s ease, opacity .18s ease, transform .15s ease;
}

.send-btn:hover{ background:var(--accent-hover); }
.send-btn:active{ transform:scale(.94); }

.send-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.send-btn svg{ width:18px; height:18px; }

/* =========================================================
   IMAGE MODAL
========================================================= */

.image-modal{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.85);
}

.image-modal.show{ display:flex; }

.modal-box{
  position:relative;
  width:min(880px,100%);
  max-height:92vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:16px;
  background:var(--surface);
  border:1px solid var(--line);
}

.modal-image-wrap{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:var(--bg);
}

.modal-box img{
  display:block;
  max-width:100%;
  max-height:75vh;
  object-fit:contain;
  border-radius:10px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:12px;
  border-top:1px solid var(--line-soft);
}

.modal-btn{
  padding:8px 14px;
  border-radius:9px;
  background:var(--accent);
  color:#fff;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:background .18s ease;
}

.modal-btn:hover{ background:var(--accent-hover); }

.modal-btn.secondary{
  background:var(--surface-2);
  color:var(--ink-soft);
  border:1px solid var(--line);
}

.modal-btn.secondary:hover{ background:#23232a; }

.modal-close{
  position:absolute;
  top:10px;
  right:10px;
  z-index:2;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:var(--surface-2);
  color:var(--ink-soft);
  border:1px solid var(--line);
  cursor:pointer;
  font-size:16px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){
  .header{
    padding-left:14px;
    padding-right:14px;
  }

  .header-badge{ display:none; }

  .chat-scroll{ padding:16px 12px 12px; }

  .welcome{ padding:22px 4px 32px; }
  .welcome h1{ font-size:23px; }

  .suggestions{
    grid-template-columns:1fr;
    gap:7px;
  }

  .message{
    max-width:94%;
    font-size:13.5px;
  }

  .message.ai{ padding:12px 14px; }

  .code-content{
    font-size:11.5px;
    padding:12px;
  }

  .composer-wrap{
    padding-left:10px;
    padding-right:10px;
  }
}

@media(max-height:600px){
  .welcome-orb{ width:52px; height:52px; }
  .welcome h1{ margin-top:12px; font-size:21px; }
  .welcome p{ font-size:12px; }
  .suggestions{ margin-top:16px; }
}

@media(prefers-reduced-motion:reduce){
  .intro-line::after,
  .ai-cursor,
  .typing span{
    animation:none !important;
  }
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro" id="intro">
  <div class="intro-logo">S</div>
  <div class="intro-title">SATXAI</div>
  <div class="intro-subtitle">Personal AI Assistant</div>
  <div class="intro-line"></div>
</div>


<!-- APP -->
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-logo">S</div>
      <div class="brand-text">
        <div class="brand-name">SATXAI</div>
        <div class="brand-status">
          <span class="status-dot"></span>
          Online
        </div>
      </div>
    </div>

    <div class="header-badge">AI Assistant</div>
  </header>


  <main class="chat-scroll" id="chatScroll">
    <div class="chat" id="chat">

      <section class="welcome" id="welcome">
        <div class="welcome-orb"><span>S</span></div>

        <h1>Halo, saya SATXAI</h1>

        <p>
          Asisten AI pribadi untuk menjawab pertanyaan,
          menganalisis gambar, dan membuat gambar dari prompt.
        </p>

        <div class="suggestions">
          <button class="suggestion" data-prompt="Jelaskan apa yang bisa kamu bantu.">
            <div class="suggestion-title">💡 Apa yang bisa kamu lakukan?</div>
            <div class="suggestion-desc">Lihat kemampuan SATXAI.</div>
          </button>

          <button class="suggestion" data-prompt="Bantu saya membuat website sederhana.">
            <div class="suggestion-title">💻 Buat website</div>
            <div class="suggestion-desc">Mulai membuat project website.</div>
          </button>

          <button class="suggestion" data-prompt="Jelaskan konsep JavaScript untuk pemula.">
            <div class="suggestion-title">📚 Belajar coding</div>
            <div class="suggestion-desc">Penjelasan sederhana dan mudah dipahami.</div>
          </button>

          <button class="suggestion" data-prompt="Berikan saya ide project Arduino yang menarik.">
            <div class="suggestion-title">🤖 Ide project</div>
            <div class="suggestion-desc">Cari inspirasi project teknologi.</div>
          </button>
        </div>
      </section>

    </div>
  </main>


  <div class="composer-wrap">

    <div class="mode-bar">
      <button class="mode-btn active" id="chatModeBtn" type="button">Chat</button>
      <button class="mode-btn" id="imageModeBtn" type="button">Buat Gambar</button>
    </div>

    <div class="preview-wrap" id="previewWrap">
      <div class="preview">
        <img id="previewImage" alt="Preview">
        <button class="preview-remove" id="removeImageBtn" type="button">×</button>
      </div>
    </div>

    <div class="composer">

      <button class="tool-btn" id="uploadBtn" type="button" aria-label="Upload gambar" title="Upload gambar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="M21 15l-5-5L5 21"></path>
        </svg>
      </button>

      <input type="file" id="fileInput" accept="image/*" hidden>

      <div class="input-area">
        <textarea id="messageInput" rows="1" placeholder="Tulis pesan..." autocomplete="off" spellcheck="true"></textarea>

function getCustomErrorMessage(error, type = "chat"){

  const errorText = String(error?.message || error || "").toLowerCase();

  if(
    errorText.includes("request too large") ||
    errorText.includes("output tokens per minute") ||
    errorText.includes("otpm") ||
    errorText.includes("rate limit") ||
    errorText.includes("too many requests") ||
    errorText.includes("429")
  ){
    return ERROR_MESSAGES.limit;
  }

  if(
    errorText.includes("401") ||
    errorText.includes("unauthorized") ||
    errorText.includes("invalid api key") ||
    errorText.includes("authentication")
  ){
    return ERROR_MESSAGES.auth;
  }

  if(
    errorText.includes("403") ||
    errorText.includes("forbidden") ||
    errorText.includes("permission")
  ){
    return ERROR_MESSAGES.permission;
  }

  if(
    errorText.includes("500") ||
    errorText.includes("502") ||
    errorText.includes("503") ||
    errorText.includes("504") ||
    errorText.includes("internal server") ||
    errorText.includes("bad gateway") ||
    errorText.includes("service unavailable")
  ){
    if(type === "image") return ERROR_MESSAGES.imageGeneral;
    return ERROR_MESSAGES.server;
  }

  if(
    errorText.includes("failed to fetch") ||
    errorText.includes("networkerror") ||
    errorText.includes("network error") ||
    errorText.includes("connection") ||
    errorText.includes("timeout") ||
    errorText.includes("timed out")
  ){
    return ERROR_MESSAGES.network;
  }

  if(type === "image"){
    if(
      errorText.includes("worker tidak mengembalikan gambar") ||
      errorText.includes("image") ||
      errorText.includes("generate")
    ){
      return ERROR_MESSAGES.image;

  if(
    errorText.includes("400") ||
    errorText.includes("bad request") ||
    errorText.includes("invalid request")
  ){
    return ERROR_MESSAGES.badRequest;
  }

  return ERROR_MESSAGES.general;
}


/* ==========================================================
   CLEAN AI RESPONSE
========================================================== */

function cleanAIResponse(text){

  if(!text) return "";

  let result = String(text)
    .replace(/\r\n/g,"\n")
    .replace(/\r/g,"\n");

  const codeBlocks = [];

  result = result.replace(
    /```[\s\S]*?```/g,
    block => {
      const index = codeBlocks.length;
      codeBlocks.push(block);
      return `@@SATXAI_CODE_${index}@@`;
    }
  );

  result = result
    .replace(/^\s*#{1,6}\s*/gm, "")
    .replace(/^\s*(?:\*{3,}|_{3,}|-{3,})\s*$/gm, "")
    .replace(/^\s*>\s?/gm, "")
    .replace(/\*\*(.*?)\*\*/gs, "$1")
    .replace(/__(.*?)__/gs, "$1")
    .replace(/~~(.*?)~~/gs, "$1");

  result = result.replace(
    /@@SATXAI_CODE_(\d+)@@/g,
    (_, index) => codeBlocks[index]
  );

  result = result.replace(/\n{4,}/g,"\n\n").trim();

  return result;
}


/* ==========================================================

function appendInlineText(container, text){

  const parts = text.split(/(`[^`\n]+`)/g);

  parts.forEach(part => {

    if(part.startsWith("`") && part.endsWith("`")){

      const code = document.createElement("span");
      code.className = "ai-inline-code";
      code.textContent = part.slice(1,-1);
      container.appendChild(code);

    }else{

      const strongParts = part.split(/(\*\*[^\*]+\*\*)/g);

      strongParts.forEach(strongPart => {

        if(
          strongPart.startsWith("**") &&
          strongPart.endsWith("**")

          const strong = document.createElement("span");
          strong.className = "ai-strong";

          container.appendChild(strong);
        }else{
          container.appendChild(
            document.createTextNode(strongPart)
          );
        }

      });
    }
  });
}


/* ==========================================================

function createCodeBlock(code, language){

  const wrapper = document.createElement("div");
  wrapper.className = "code-block";

  const header = document.createElement("div");
  header.className = "code-header";

  const languageLabel = document.createElement("span");

        <rect x="9" y="9" width="11" height="11" rx="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    `;
  };

  setCopyNormal();

  const codeElement = document.createElement("pre");
  codeElement.className = "code-content";
  codeElement.textContent = code;

  copyButton.addEventListener("click", async () => {

    const copyText = codeElement.textContent;

    try{
      await navigator.clipboard.writeText(copyText);
    }catch{
      const textarea = document.createElement("textarea");
      textarea.value = copyText;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }

    copyButton.classList.add("copied");
    copyButton.innerHTML = `
      <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
      <span>Copied</span>
    `;

    setTimeout(setCopyNormal, 1800);
  });

  header.appendChild(languageLabel);
  header.appendChild(copyButton);

  wrapper.appendChild(header);
  wrapper.appendChild(codeElement);

  return wrapper;
}


/* ==========================================================
   PARSE RESPONSE
========================================================== */

function parseResponseParts(text){

  const parts = [];
  const regex = /```([a-zA-Z0-9_+#.-]*)\s*\n?([\s\S]*?)```/g;

  let lastIndex = 0;
  let match;

  while((match = regex.exec(text)) !== null){

    if(match.index > lastIndex){
      parts.push({
        type:"text",
        content: text.slice(lastIndex, match.index)
      });
    }

    parts.push({
      type:"code",
      language: match[1] || "code",
      content: match[2].replace(/^\n/,"").replace(/\n$/,"")
    });

    lastIndex = regex.lastIndex;
  }

  if(lastIndex < text.length){
    parts.push({
      type:"text",
      content: text.slice(lastIndex)
    });
  }

  return parts;
}


/* ==========================================================
   ANIMATE TEXT
========================================================== */

function animateText(container, text){

  return new Promise(resolve => {

    if(!text){ resolve(); return; }

    const wrapper = document.createElement("div");
    wrapper.className = "ai-typewriter";

    const textNode = document.createTextNode("");
    const cursor = document.createElement("span");
    cursor.className = "ai-cursor";

    wrapper.appendChild(textNode);
    wrapper.appendChild(cursor);
    container.appendChild(wrapper);

    let index = 0;

    function typeNext(){

      if(index >= text.length){
        cursor.remove();
        resolve();
        return;
      }

      const char = text[index];
      textNode.nodeValue += char;
      index++;

      scrollToBottom();

      let delay = 12 + Math.random() * 10;

      if(char === "." || char === "," || char === "!" || char === "?"){
        delay += 35;
      }

      if(char === "\n"){
        delay += 25;
      }

      setTimeout(typeNext, delay);
    }

    typeNext();
  });
}


/* ==========================================================
   ANIMATE CODE BLOCK
========================================================== */

function animateCodeBlock(container, code, language){

  return new Promise(resolve => {

    const codeBlock = createCodeBlock("", language);
    const codeElement = codeBlock.querySelector(".code-content");
    container.appendChild(codeBlock);

    let index = 0;

    function typeCode(){

      if(index >= code.length){
        resolve();
        return;
      }

      const chunk = code.slice(index, index + 2);
      codeElement.textContent += chunk;
      index += chunk.length;

      scrollToBottom();
      setTimeout(typeCode, 5);
    }

    typeCode();
  });
}


/* ==========================================================
   ANIMATE AI RESPONSE
========================================================== */

async function animateAIResponse(bubble, text){

  const cleaned = cleanAIResponse(text);

  const container = document.createElement("div");
  container.className = "ai-content";
  bubble.appendChild(container);

  const parts = parseResponseParts(cleaned);

  for(const part of parts){

    if(part.type === "text"){
      if(!part.content) continue;
      await animateText(container, part.content);
    }else{
      await animateCodeBlock(container, part.content, part.language);
    }
  }

  const finalContainer = renderAIResponse(cleaned);
  bubble.replaceChildren(finalContainer);

  scrollToBottom();
}


/* ==========================================================
   RENDER AI RESPONSE FINAL
   (fix numbering + list tidak ditutup oleh baris kosong)
========================================================== */

function renderAIResponse(text){

  const cleaned = cleanAIResponse(text);

  const container = document.createElement("div");
  container.className = "ai-content";

  const parts = parseResponseParts(cleaned);

  parts.forEach(part => {

    if(part.type === "code"){
      container.appendChild(
        createCodeBlock(part.content, part.language)
      );
      return;
    }

    const lines = part.content.split("\n");

    let currentParagraph = [];
    let currentList = null;
    let currentNumberedList = null;

    function flushParagraph(){
      if(currentParagraph.length === 0) return;

      const paragraph = document.createElement("div");
      paragraph.className = "ai-paragraph";

      currentParagraph.forEach((line, index) => {
        if(index > 0){
          paragraph.appendChild(document.createElement("br"));
        }
        appendInlineText(paragraph, line);
      });

      container.appendChild(paragraph);
      currentParagraph = [];
    }

    function flushLists(){
      if(currentList){
        container.appendChild(currentList);
        currentList = null;
      }
      if(currentNumberedList){
        container.appendChild(currentNumberedList);
        currentNumberedList = null;
      }
    }

    lines.forEach(rawLine => {

      const line = rawLine.trim();

      /* Baris kosong: hanya tutup paragraf.
         List sengaja TIDAK ditutup, supaya
         item bernomor tetap nyambung. */
      if(!line){
        flushParagraph();
        return;
      }

      /* Bullet */
      const bulletMatch = line.match(/^[-*•]\s+(.+)$/);
      if(bulletMatch){
        flushParagraph();
        if(currentNumberedList) flushLists();

        if(!currentList){
          currentList = document.createElement("ul");
          currentList.className = "ai-list";
        }

        const li = document.createElement("li");
        appendInlineText(li, bulletMatch[1]);
        currentList.appendChild(li);
        return;
      }

      /* Numbered — simpan angka asli ke li.value
         supaya kalau <ol>-nya kepisah, nomor
         tetap sesuai (1, 2, 3, ...) */
      const numberedMatch = line.match(/^(\d+)[.)]\s+(.+)$/);
      if(numberedMatch){
        flushParagraph();
        if(currentList) flushLists();

        if(!currentNumberedList){
          currentNumberedList = document.createElement("ol");
          currentNumberedList.className = "ai-numbered-list";
        }

        const li = document.createElement("li");
        const num = parseInt(numberedMatch[1], 10);
        if(!isNaN(num)) li.value = num;
        appendInlineText(li, numberedMatch[2]);
        currentNumberedList.appendChild(li);
        return;
      }

      /* Teks biasa: tutup list, mulai paragraf baru */
      flushLists();
      currentParagraph.push(line);
    });

    flushParagraph();
    flushLists();
  });

  return container;
}

/* ==========================================================
   RESIZE IMAGE
========================================================== */

function resizeImage(file, maxSize, quality){

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = event => {

      const img = new Image();

      img.onload = () => {

        let width = img.width;
        let height = img.height;

        if(width > maxSize || height > maxSize){
          const scale = Math.min(maxSize / width, maxSize / height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        resolve(canvas.toDataURL("image/jpeg", quality));
      };

      img.onerror = reject;
      img.src = event.target.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}


/* ==========================================================
   TEXTAREA AUTO RESIZE
========================================================== */

function autoResize(){
  messageInput.style.height = "auto";
  const height = Math.min(messageInput.scrollHeight, 130);
  messageInput.style.height = `${height}px`;
}

messageInput.addEventListener("input", autoResize);


/* ==========================================================
   SUGGESTIONS
========================================================== */

document.querySelectorAll(".suggestion").forEach(button => {
  button.addEventListener("click", () => {
    messageInput.value = button.dataset.prompt;
    autoResize();
    sendMessage();
  });
});


/* ==========================================================
   GENERATE IMAGE
========================================================== */

async function generateImage(prompt){

  const response = await fetch(IMAGE_API_URL, {
    method:"POST",
    headers:{ "Content-Type": "application/json" },
    body: JSON.stringify({ prompt })
  });

  const text = await response.text();
  let data;

  try{ data = JSON.parse(text); }
  catch{ data = null; }

  if(!response.ok){
    const errorMessage =
      data?.error || data?.message || text || `HTTP ${response.status}`;
    throw new Error(errorMessage);
  }

  let imageUrl = null;

  if(typeof data === "string"){
    imageUrl = data;
  }else if(data){
    imageUrl = data.image || data.image_url || data.url || data.result;

    if(data.result && typeof data.result === "object"){
      imageUrl =
        data.result.image ||
        data.result.image_url ||
        data.result.url ||
        data.result.b64_json ||
        imageUrl;
    }
  }

  if(
    imageUrl &&
    !imageUrl.startsWith("data:") &&
    !imageUrl.startsWith("http") &&
    imageUrl.length > 100
  ){
    imageUrl = "data:image/png;base64," + imageUrl;
  }

  if(!imageUrl){
    throw new Error("Worker tidak mengembalikan gambar.");
  }

  return imageUrl;
}


/* ==========================================================
   SEND MESSAGE
========================================================== */

async function sendMessage(){

  if(isGenerating) return;

  const text = messageInput.value.trim();

  if(!text && !selectedImageData) return;

  removeWelcome();

  isGenerating = true;
  sendBtn.disabled = true;

  /* ========================================================
     IMAGE MODE
  ======================================================== */

  if(currentMode === "image"){

    if(!text){
      isGenerating = false;
      sendBtn.disabled = false;
      return;
    }

    appendMessage("user", text);
    messageInput.value = "";
    autoResize();
    showTyping();

    try{
      const imageUrl = await generateImage(text);
      hideTyping();
      appendGeneratedImageMessage(imageUrl, text);
    }catch(error){
      hideTyping();
      appendMessage("ai", getCustomErrorMessage(error, "image"));
      console.error("Image generation error:", error);
    }

    isGenerating = false;
    sendBtn.disabled = false;
    return;
  }


  /* ========================================================
     CHAT / VISION
  ======================================================== */

  let userContent;

  if(selectedImageData){
    userContent = [
      {
        type:"text",
        text: text || "Analisis gambar ini dengan teliti. Jelaskan apa yang terlihat."
      },
      {
        type:"image_url",
        image_url:{ url: selectedImageData }
      }
    ];
  }else{
    userContent = text;
  }

  appendMessage("user", text || "📷 Mengirim gambar...");

  messages.push({ role:"user", content:userContent });

  messageInput.value = "";
  autoResize();

  selectedImageData = null;
  selectedImageFile = null;
  previewImage.src = "";
  previewWrap.classList.remove("show");
  fileInput.value = "";

  showTyping();

  try{
    const response = await fetch(API_URL, {
      method:"POST",
      headers:{ "Content-Type": "application/json" },
      body: JSON.stringify({
        model: MODEL,
        messages: messages,
        max_tokens: MAX_TOKENS,
        temperature: 0.75
      })
    });

    const rawText = await response.text();
    let data;

    try{ data = JSON.parse(rawText); }
    catch{ data = null; }

    if(!response.ok){
      const errorMessage =
        data?.error?.message ||
        data?.error ||
        data?.message ||
        rawText ||
        `HTTP ${response.status}`;
      throw new Error(errorMessage);
    }

    const reply = data?.choices?.[0]?.message?.content;

    if(!reply){
      throw new Error("AI tidak mengembalikan jawaban.");
    }

    const cleanReply = cleanAIResponse(reply);

    hideTyping();

    const row = document.createElement("div");
    row.className = "message-row ai";

    const bubble = document.createElement("div");
    bubble.className = "message ai";

    row.appendChild(bubble);
    chat.appendChild(row);

    await animateAIResponse(bubble, cleanReply);

    messages.push({ role:"assistant", content: cleanReply });

  }catch(error){
    hideTyping();
    appendMessage("ai", getCustomErrorMessage(error, "chat"));
    console.error("SATXAI error:", error);
  }

  isGenerating = false;
  sendBtn.disabled = false;
}


/* ==========================================================
   SEND BUTTON
========================================================== */

sendBtn.addEventListener("click", sendMessage);


/* ==========================================================
   ENTER TO SEND
========================================================== */

messageInput.addEventListener("keydown", event => {
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
});


/* ==========================================================
   ESC CLOSE MODAL
========================================================== */

document.addEventListener("keydown", event => {
  if(event.key === "Escape") closeImageModal();
});


/* ==========================================================
   PREVENT MOBILE GESTURE ZOOM
========================================================== */

document.addEventListener("gesturestart", e => e.preventDefault(), { passive:false });
document.addEventListener("gesturechange", e => e.preventDefault(), { passive:false });
document.addEventListener("gestureend", e => e.preventDefault(), { passive:false });


/* ==========================================================
   INITIALIZE
========================================================== */

setMode("chat");
autoResize();

</script>
