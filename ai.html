<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>
<title>Zevora AI</title>

<style>
:root{
  --bg:#ffffff;
  --surface:#f7f7f7;
  --surface-2:#f0f0f0;
  --bubble:#c7c6c6;
  --bubble-ai:#c7c6c6;
  --line:#e5e5e5;
  --line-soft:#ececec;

  --ink:#0d0d0d;
  --ink-soft:#3d3d3d;
  --ink-mute:#8f8f8f;

  --accent:#0d0d0d;
  --accent-hover:#2a2a2a;

  --danger:#e02e2a;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html, body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

body{
  font-family:
    "Inter",
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

button, textarea, input{ font:inherit; }
button{ border:0; outline:0; background:none; cursor:pointer; }

/* INTRO */

.intro{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  transition:opacity .3s ease, visibility .3s ease;
}

.intro.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/* ===== LOADER (Uiverse by Nawsome) ===== */
.loader {
  position: relative;
  width: 75px;
  height: 100px;
}

.loader__bar {
  position: absolute;
  bottom: 0;
  width: 10px;
  height: 50%;
  background: rgb(0, 0, 0);
  transform-origin: center bottom;
  box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.2);
}

.loader__bar:nth-child(1) {
  left: 0px;
  transform: scale(1, 0.2);
  -webkit-animation: barUp1 4s infinite;
  animation: barUp1 4s infinite;
}

.loader__bar:nth-child(2) {
  left: 15px;
  transform: scale(1, 0.4);
  -webkit-animation: barUp2 4s infinite;
  animation: barUp2 4s infinite;
}

.loader__bar:nth-child(3) {
  left: 30px;
  transform: scale(1, 0.6);
  -webkit-animation: barUp3 4s infinite;
  animation: barUp3 4s infinite;
}

.loader__bar:nth-child(4) {
  left: 45px;
  transform: scale(1, 0.8);
  -webkit-animation: barUp4 4s infinite;
  animation: barUp4 4s infinite;
}

.loader__bar:nth-child(5) {
  left: 60px;
  transform: scale(1, 1);
  -webkit-animation: barUp5 4s infinite;
  animation: barUp5 4s infinite;
}

.loader__ball {
  position: absolute;
  bottom: 10px;
  left: 0;
  width: 10px;
  height: 10px;
  background: rgb(44, 143, 255);
  border-radius: 50%;
  -webkit-animation: ball624 4s infinite;
  animation: ball624 4s infinite;
}

@keyframes ball624 {
  0% { transform: translate(0, 0); }
  5% { transform: translate(8px, -14px); }
  10% { transform: translate(15px, -10px); }
  17% { transform: translate(23px, -24px); }
  20% { transform: translate(30px, -20px); }
  27% { transform: translate(38px, -34px); }
  30% { transform: translate(45px, -30px); }
  37% { transform: translate(53px, -44px); }
  40% { transform: translate(60px, -40px); }
  50% { transform: translate(60px, 0); }
  57% { transform: translate(53px, -14px); }
  60% { transform: translate(45px, -10px); }
  67% { transform: translate(37px, -24px); }
  70% { transform: translate(30px, -20px); }
  77% { transform: translate(22px, -34px); }
  80% { transform: translate(15px, -30px); }
  87% { transform: translate(7px, -44px); }
  90% { transform: translate(0, -40px); }
  100% { transform: translate(0, 0); }
}

@-webkit-keyframes barUp1 {
  0% { transform: scale(1, 0.2); }
  40% { transform: scale(1, 0.2); }
  50% { transform: scale(1, 1); }
  90% { transform: scale(1, 1); }
  100% { transform: scale(1, 0.2); }
}
@keyframes barUp1 {
  0% { transform: scale(1, 0.2); }
  40% { transform: scale(1, 0.2); }
  50% { transform: scale(1, 1); }
  90% { transform: scale(1, 1); }
  100% { transform: scale(1, 0.2); }
}

@-webkit-keyframes barUp2 {
  0% { transform: scale(1, 0.4); }
  40% { transform: scale(1, 0.4); }
  50% { transform: scale(1, 0.8); }
  90% { transform: scale(1, 0.8); }
  100% { transform: scale(1, 0.4); }
}
@keyframes barUp2 {
  0% { transform: scale(1, 0.4); }
  40% { transform: scale(1, 0.4); }
  50% { transform: scale(1, 0.8); }
  90% { transform: scale(1, 0.8); }
  100% { transform: scale(1, 0.4); }
}

@-webkit-keyframes barUp3 {
  0% { transform: scale(1, 0.6); }
  100% { transform: scale(1, 0.6); }
}
@keyframes barUp3 {
  0% { transform: scale(1, 0.6); }
  100% { transform: scale(1, 0.6); }
}

@-webkit-keyframes barUp4 {
  0% { transform: scale(1, 0.8); }
  40% { transform: scale(1, 0.8); }
  50% { transform: scale(1, 0.4); }
  90% { transform: scale(1, 0.4); }
  100% { transform: scale(1, 0.8); }
}
@keyframes barUp4 {
  0% { transform: scale(1, 0.8); }
  40% { transform: scale(1, 0.8); }
  50% { transform: scale(1, 0.4); }
  90% { transform: scale(1, 0.4); }
  100% { transform: scale(1, 0.8); }
}

@-webkit-keyframes barUp5 {
  0% { transform: scale(1, 1); }
  40% { transform: scale(1, 1); }
  50% { transform: scale(1, 0.2); }
  90% { transform: scale(1, 0.2); }
  100% { transform: scale(1, 1); }
}
@keyframes barUp5 {
  0% { transform: scale(1, 1); }
  40% { transform: scale(1, 1); }
  50% { transform: scale(1, 0.2); }
  90% { transform: scale(1, 0.2); }
  100% { transform: scale(1, 1); }
}
/* ===== END LOADER ===== */

/* APP */

.app{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

/* HEADER */

.header{
  position:relative;
  flex:0 0 auto;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:
    max(12px, env(safe-area-inset-top))
    18px
    12px;
  background:var(--bg);
  border-bottom:1px solid var(--line-soft);
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:7px;
}

.brand-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:0;
  padding:0;
  font-size:20px;
  line-height:1;
}

.brand-name{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.2px;
  color:var(--ink);
}

.brand-status,
.status-dot,
.header-badge{
  display:none;
}

/* CHAT SCROLL */

.chat-scroll{
  position:relative;
  z-index:1;
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:24px 16px 16px;
}

.chat-scroll::-webkit-scrollbar{ width:5px; }
.chat-scroll::-webkit-scrollbar-track{ background:transparent; }
.chat-scroll::-webkit-scrollbar-thumb{
  background:#d8d8d8;
  border-radius:999px;
}

.chat{
  width:100%;
  max-width:760px;
  margin:0 auto;
}

/* WELCOME */

.welcome{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:40px 8px 48px;
}

.welcome-orb{ display:none; }

.welcome h1{
  margin:0 0 8px;
  font-size:26px;
  line-height:1.2;
  letter-spacing:-.6px;
  color:var(--ink);
  font-weight:600;
}

.welcome p{
  max-width:440px;
  margin:0;
  color:var(--ink-mute);
  font-size:14px;
  line-height:1.6;
}

.suggestions{
  width:100%;
  max-width:600px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:28px;
}

.suggestion{
  padding:14px 16px;
  text-align:left;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--bg);
  color:var(--ink);
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease;
}

.suggestion:hover{
  background:var(--surface);
  border-color:#d8d8d8;
}

.suggestion-title{
  font-size:13.5px;
  font-weight:500;
}

.suggestion-desc{
  margin-top:3px;
  color:var(--ink-mute);
  font-size:12px;
  line-height:1.4;
}

/* MESSAGE */

.message-row{
  width:100%;
  display:flex;
  margin-bottom:16px;
}

.message-row.user{ justify-content:flex-end; }
.message-row.ai{ justify-content:flex-start; }

.message{
  width:auto;
  max-width:100%;
  font-size:15px;
  line-height:1.7;
  word-break:break-word;
}

.message.user{
  max-width:min(78%,620px);
  white-space:pre-wrap;
  background:var(--bubble);
  color:var(--ink);
  border-radius:20px;
  border-bottom-right-radius:6px;
  padding:10px 16px;
}

.message.ai{
  max-width:min(92%,720px);
  background:var(--bubble-ai);
  color:var(--ink);
  border-radius:20px;
  border-bottom-left-radius:6px;
  padding:12px 16px;
}

/* AI TEXT */

.ai-content{ width:100%; }

.ai-paragraph{ margin:0 0 12px; }
.ai-paragraph:last-child{ margin-bottom:0; }

.ai-line{ margin:0 0 8px; }
.ai-line:last-child{ margin-bottom:0; }

.ai-list{
  margin:6px 0 12px;
  padding-left:22px;
}

.ai-list li{ margin-bottom:5px; }

.ai-numbered-list{
  margin:6px 0 12px;
  padding-left:22px;
}

.ai-numbered-list li{ margin-bottom:5px; }

.ai-strong{
  font-weight:600;
  color:var(--ink);
}

.ai-inline-code{
  padding:2px 6px;
  border-radius:6px;
  background:rgba(0,0,0,.08);
  color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:.88em;
}

/* TYPEWRITER */

.ai-typewriter{
  white-space:pre-wrap;
  word-break:break-word;
}

.ai-cursor{
  display:inline-block;
  width:2px;
  height:15px;
  margin-left:2px;
  vertical-align:-3px;
  border-radius:2px;
  background:var(--ink);
  animation:cursorBlink .9s ease-in-out infinite;
}

@keyframes cursorBlink{
  0%,45%{ opacity:1; }
  50%,100%{ opacity:0; }
}

/* CODE BLOCK */

.code-block{
  position:relative;
  width:100%;
  margin:12px 0;
  overflow:hidden;
  border-radius:12px;
  background:#0d0d0d;
  border:1px solid #2a2a2a;
}

.code-block:last-child{ margin-bottom:0; }

.code-header{
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 10px 6px 14px;
  background:#171717;
  border-bottom:1px solid #262626;
}

.code-language{
  color:#b4b4b4;
  font-size:11px;
  font-weight:500;
  letter-spacing:.2px;
}

.copy-code-btn{
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 9px;
  border-radius:7px;
  background:#262626;
  color:#d4d4d4;
  border:1px solid #333;
  font-size:11px;
  font-weight:500;
  cursor:pointer;
  transition:background .15s ease, color .15s ease;
}

.copy-code-btn:hover{
  background:#333;
  color:#fff;
}

.copy-code-btn:active{ transform:scale(.97); }

.copy-code-btn.copied{
  background:#1f3d2b;
  color:#bff0cf;
  border-color:#2a4a35;
}

.copy-icon{ width:13px; height:13px; flex:0 0 13px; }

.code-content{
  width:100%;
  margin:0;
  padding:14px;
  overflow-x:auto;
  color:#e6e6e6;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  font-size:12.5px;
  line-height:1.65;
  white-space:pre;
  tab-size:2;
}

.code-content::-webkit-scrollbar{ height:5px; }
.code-content::-webkit-scrollbar-thumb{
  background:#333;
  border-radius:999px;
}

/* TYPING DOTS */

.message.ai.typing-message{
  width:auto;
  height:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  background:var(--bubble-ai);
  border-radius:20px;
  border-bottom-left-radius:6px;
}

.typing{
  display:flex;
  align-items:center;
  gap:5px;
}

.typing span{
  display:block;
  width:7px;
  height:7px;
  flex:0 0 7px;
  border-radius:50%;
  background:#8a8a8a;
  animation:typing 1s infinite ease-in-out;
}

.typing span:nth-child(2){ animation-delay:.15s; }
.typing span:nth-child(3){ animation-delay:.30s; }

@keyframes typing{
  0%,60%,100%{ opacity:.35; transform:translateY(0); }
  30%{ opacity:1; transform:translateY(-3px); }
}

/* GENERATED IMAGE */

.generated-image{
  width:100%;
  max-width:520px;
  display:block;
  border-radius:14px;
  border:1px solid var(--line);
  cursor:pointer;
  transition:opacity .2s ease;
}

.generated-image:hover{ opacity:.94; }

.image-message-label{
  margin-bottom:8px;
  color:var(--ink-mute);
  font-size:12.5px;
}

/* COMPOSER */

.composer-wrap{
  position:relative;
  flex:0 0 auto;
  width:100%;
  padding:
    8px
    14px
    max(12px, env(safe-area-inset-bottom));
  background:var(--bg);
  z-index:30;
}

.mode-bar{
  width:100%;
  max-width:760px;
  margin:0 auto 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.mode-btn{
  padding:6px 14px;
  border-radius:999px;
  background:transparent;
  color:var(--ink-mute);
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  transition:background .15s ease, color .15s ease;
}

.mode-btn:hover{ color:var(--ink-soft); }

.mode-btn.active{
  background:var(--surface-2);
  color:var(--ink);
}

.preview-wrap{
  display:none;
  width:100%;
  max-width:760px;
  margin:0 auto 8px;
}

.preview-wrap.show{ display:flex; }

.preview{
  position:relative;
  width:60px;
  height:60px;
}

.preview img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--line);
}

.preview-remove{
  position:absolute;
  top:-6px;
  right:-6px;
  width:20px;
  height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:var(--ink);
  border:0;
  color:#fff;
  font-size:13px;
  line-height:1;
  cursor:pointer;
}

.composer{
  width:100%;
  max-width:760px;
  margin:0 auto;
  display:flex;
  align-items:flex-end;
  gap:4px;
  padding:6px 8px 6px 6px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
  transition:border-color .2s ease, box-shadow .2s ease;
}

.composer:focus-within{
  border-color:#d4d4d4;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.tool-btn{
  flex:0 0 34px;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:transparent;
  color:var(--ink-soft);
  cursor:pointer;
  transition:background .15s ease;
}

.tool-btn:hover{ background:var(--surface-2); }

.tool-btn svg{ width:19px; height:19px; }

/* ==========================================================
   INPUT FILE — FIX untuk HP (iOS/Android)
   HAPUS pointer-events:none agar file picker bisa dibuka
   ========================================================== */
.sr-file{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  clip-path:inset(50%);
  white-space:nowrap;
  border:0;
  opacity:0;
}

.input-area{
  flex:1;
  min-width:0;
}

textarea{
  width:100%;
  min-height:34px;
  max-height:130px;
  display:block;
  resize:none;
  padding:8px 4px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--ink);
  font-size:15px;
  line-height:20px;
}

textarea::placeholder{ color:var(--ink-mute); }

.send-btn{
  flex:0 0 34px;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  transition:background .15s ease, opacity .15s ease, transform .1s ease;
}

.send-btn:hover{ background:var(--accent-hover); }
.send-btn:active{ transform:scale(.94); }

.send-btn:disabled{
  background:#d4d4d4;
  cursor:not-allowed;
}

.send-btn svg{ width:17px; height:17px; }

/* IMAGE MODAL */

.image-modal{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.7);
}

.image-modal.show{ display:flex; }

.modal-box{
  position:relative;
  width:min(880px,100%);
  max-height:92vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:16px;
  background:var(--bg);
  border:1px solid var(--line);
}

.modal-image-wrap{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:var(--bg);
}

.modal-box img{
  display:block;
  max-width:100%;
  max-height:75vh;
  object-fit:contain;
  border-radius:10px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:12px;
  border-top:1px solid var(--line-soft);
}

.modal-btn{
  padding:8px 16px;
  border-radius:10px;
  background:var(--ink);
  color:#fff;
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  transition:background .15s ease;
}

.modal-btn:hover{ background:var(--accent-hover); }

.modal-btn.secondary{
  background:var(--surface-2);
  color:var(--ink);
  border:1px solid var(--line);
}

.modal-btn.secondary:hover{ background:var(--surface); }

.modal-close{
  position:absolute;
  top:10px;
  right:10px;
  z-index:2;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:var(--surface-2);
  color:var(--ink-soft);
  border:1px solid var(--line);
  cursor:pointer;
  font-size:16px;
}

/* MOBILE */

@media(max-width:650px){
  .header{
    padding-left:14px;
    padding-right:14px;
  }

  .chat-scroll{ padding:18px 12px 12px; }

  .welcome{ padding:28px 4px 36px; }
  .welcome h1{ font-size:23px; }

  .suggestions{
    grid-template-columns:1fr;
    gap:8px;
  }

  .message{ font-size:14.5px; }
  .message.user{ padding:10px 14px; }
  .message.ai{ padding:11px 14px; }

  .code-content{
    font-size:11.5px;
    padding:12px;
  }

  .composer-wrap{
    padding-left:10px;
    padding-right:10px;
  }
}

@media(max-height:600px){
  .welcome h1{ font-size:21px; }
  .welcome p{ font-size:13px; }
  .suggestions{ margin-top:18px; }
}

@media(prefers-reduced-motion:reduce){
  .loader__bar,
  .loader__ball,
  .ai-cursor,
  .typing span{
    animation:none !important;
  }
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro" id="intro">
  <div class="loader">
    <div class="loader__bar"></div>
    <div class="loader__bar"></div>
    <div class="loader__bar"></div>
    <div class="loader__bar"></div>
    <div class="loader__bar"></div>
    <div class="loader__ball"></div>
  </div>
</div>


<!-- APP -->
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-logo">💬</div>

function getCustomErrorMessage(error, type = "chat"){

  const errorText = String(error?.message || error || "").toLowerCase();

  if(
    errorText.includes("request too large") ||
    errorText.includes("output tokens per minute") ||
    errorText.includes("otpm") ||
    errorText.includes("rate limit") ||
    errorText.includes("too many requests") ||
    errorText.includes("429")
  ){
    return ERROR_MESSAGES.limit;
  }

  if(
    errorText.includes("401") ||
    errorText.includes("unauthorized") ||
    errorText.includes("invalid api key") ||
    errorText.includes("authentication")
  ){
    return ERROR_MESSAGES.auth;
  }

  if(
    errorText.includes("403") ||
    errorText.includes("forbidden") ||
    errorText.includes("permission")
  ){
    return ERROR_MESSAGES.permission;
  }

  if(
    errorText.includes("500") ||
    errorText.includes("502") ||
    errorText.includes("503") ||
    errorText.includes("504") ||
    errorText.includes("internal server") ||
    errorText.includes("bad gateway") ||
    errorText.includes("service unavailable")
  ){
    if(type === "image") return ERROR_MESSAGES.imageGeneral;
    return ERROR_MESSAGES.server;
  }

  if(
    errorText.includes("failed to fetch") ||
    errorText.includes("networkerror") ||
    errorText.includes("network error") ||
    errorText.includes("connection") ||
    errorText.includes("timeout") ||
    errorText.includes("timed out")
  ){
    return ERROR_MESSAGES.network;
  }

  if(type === "image"){
    if(
      errorText.includes("worker tidak mengembalikan gambar") ||
      errorText.includes("image") ||
      errorText.includes("generate")
    ){
      return ERROR_MESSAGES.image;
    }
    return ERROR_MESSAGES.imageGeneral;
  }

  if(
    errorText.includes("400") ||
    errorText.includes("bad request") ||
    errorText.includes("invalid request")
  ){
    return ERROR_MESSAGES.badRequest;
  }

  return ERROR_MESSAGES.general;
}


/* ==========================================================
   CLEAN AI RESPONSE
========================================================== */

function cleanAIResponse(text){

  if(!text) return "";

  let result = String(text)
    .replace(/\r\n/g,"\n")
    .replace(/\r/g,"\n");

  const codeBlocks = [];

  result = result.replace(
    /```[\s\S]*?```/g,
    block => {
      const index = codeBlocks.length;
      codeBlocks.push(block);
      return `@@ZEVORA_CODE_${index}@@`;
    }
  );

  result = result
    .replace(/^\s*#{1,6}\s*/gm, "")
    .replace(/^\s*(?:\*{3,}|_{3,}|-{3,})\s*$/gm, "")
    .replace(/^\s*>\s?/gm, "")
    .replace(/\*\*(.*?)\*\*/gs, "$1")
    .replace(/__(.*?)__/gs, "$1")
    .replace(/~~(.*?)~~/gs, "$1");

  result = result.replace(
    /@@ZEVORA_CODE_(\d+)@@/g,
    (_, index) => codeBlocks[index]
  );

  result = result.replace(/\n{4,}/g,"\n\n").trim();

  return result;
}


/* ==========================================================
   APPEND INLINE TEXT
========================================================== */

function appendInlineText(container, text){

  const parts = text.split(/(`[^`\n]+`)/g);

  parts.forEach(part => {

    if(part.startsWith("`") && part.endsWith("`")){

      const code = document.createElement("span");
      code.className = "ai-inline-code";
      code.textContent = part.slice(1,-1);
      container.appendChild(code);

    }else{

      const strongParts = part.split(/(\*\*[^\*]+\*\*)/g);

      strongParts.forEach(strongPart => {

        if(
          strongPart.startsWith("**") &&
          strongPart.endsWith("**")
        ){
          const strong = document.createElement("span");
          strong.className = "ai-strong";
          strong.textContent = strongPart.slice(2,-2);
          container.appendChild(strong);
        }else{
          container.appendChild(
            document.createTextNode(strongPart)
          );
        }

      });
    }
  });
}


/* ==========================================================
   CREATE CODE BLOCK
========================================================== */

function createCodeBlock(code, language){

  const wrapper = document.createElement("div");
  wrapper.className = "code-block";

  const header = document.createElement("div");
  header.className = "code-header";

  const languageLabel = document.createElement("span");
  languageLabel.className = "code-language";
  languageLabel.textContent = language || "code";

  const copyButton = document.createElement("button");
  copyButton.type = "button";
  copyButton.className = "copy-code-btn";

  const setCopyNormal = () => {
    copyButton.classList.remove("copied");
    copyButton.innerHTML = `
      <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="11" height="11" rx="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    `;
  };

  setCopyNormal();

  const codeElement = document.createElement("pre");
  codeElement.className = "code-content";
  codeElement.textContent = code;

  copyButton.addEventListener("click", async () => {

    const copyText = codeElement.textContent;

    try{
      await navigator.clipboard.writeText(copyText);
    }catch{
      const textarea = document.createElement("textarea");
      textarea.value = copyText;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }

    copyButton.classList.add("copied");
    copyButton.innerHTML = `
      <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
      <span>Copied</span>
    `;

    setTimeout(setCopyNormal, 1800);
  });

  header.appendChild(languageLabel);
  header.appendChild(copyButton);

  wrapper.appendChild(header);
  wrapper.appendChild(codeElement);

  return wrapper;
}


/* ==========================================================
   PARSE RESPONSE
========================================================== */

function parseResponseParts(text){

  const parts = [];
  const regex = /```([a-zA-Z0-9_+#.-]*)\s*\n?([\s\S]*?)```/g;

  let lastIndex = 0;
  let match;

  while((match = regex.exec(text)) !== null){

    if(match.index > lastIndex){
      parts.push({
        type:"text",
        content: text.slice(lastIndex, match.index)
      });
    }

    parts.push({
      type:"code",
      language: match[1] || "code",
      content: match[2].replace(/^\n/,"").replace(/\n$/,"")
    });

    lastIndex = regex.lastIndex;
  }

  if(lastIndex < text.length){
    parts.push({
      type:"text",
      content: text.slice(lastIndex)
    });
  }

  return parts;
}


/* ==========================================================
   ANIMATE TEXT
========================================================== */

function animateText(container, text){

  return new Promise(resolve => {

    if(!text){ resolve(); return; }

    const wrapper = document.createElement("div");
    wrapper.className = "ai-typewriter";

    const textNode = document.createTextNode("");
    const cursor = document.createElement("span");
    cursor.className = "ai-cursor";

    wrapper.appendChild(textNode);
    wrapper.appendChild(cursor);
    container.appendChild(wrapper);

    let index = 0;
    const len = text.length;

    const chunk =
      len > 600 ? 5 :
      len > 300 ? 3 :
      len > 120 ? 2 : 1;

    const delay = 4;

    function typeNext(){

      if(index >= len){
        textNode.nodeValue = text;
        cursor.remove();
        resolve();
        return;
      }

      textNode.nodeValue += text.slice(index, index + chunk);
      index += chunk;

      scrollToBottom();
      setTimeout(typeNext, delay);
    }

    typeNext();
  });
}


/* ==========================================================
   ANIMATE CODE BLOCK
========================================================== */

function animateCodeBlock(container, code, language){

  return new Promise(resolve => {

    const codeBlock = createCodeBlock("", language);
    const codeElement = codeBlock.querySelector(".code-content");
    container.appendChild(codeBlock);

    let index = 0;
    const len = code.length;

    const chunk =
      len > 1200 ? 20 :
      len > 500 ? 12 :
      len > 200 ? 8 : 4;

    const delay = 3;

    function typeCode(){

      if(index >= len){
        codeElement.textContent = code;
        resolve();
        return;
      }

      codeElement.textContent += code.slice(index, index + chunk);
      index += chunk;

      scrollToBottom();
      setTimeout(typeCode, delay);
    }

    typeCode();
  });
}


/* ==========================================================
   ANIMATE AI RESPONSE
========================================================== */

async function animateAIResponse(bubble, text){

  const cleaned = cleanAIResponse(text);

  const container = document.createElement("div");
  container.className = "ai-content";
  bubble.appendChild(container);

  const parts = parseResponseParts(cleaned);

  for(const part of parts){

    if(part.type === "text"){
      if(!part.content) continue;
      await animateText(container, part.content);
    }else{
      await animateCodeBlock(container, part.content, part.language);
    }
  }

  const finalContainer = renderAIResponse(cleaned);
  bubble.replaceChildren(finalContainer);

  scrollToBottom();
}


/* ==========================================================
   RENDER AI RESPONSE FINAL
========================================================== */

function renderAIResponse(text){

  const cleaned = cleanAIResponse(text);

  const container = document.createElement("div");
  container.className = "ai-content";

  const parts = parseResponseParts(cleaned);

  parts.forEach(part => {

    if(part.type === "code"){
      container.appendChild(
        createCodeBlock(part.content, part.language)
      );
      return;
    }

    const lines = part.content.split("\n");

    let currentParagraph = [];
    let currentList = null;
    let currentNumberedList = null;

    function flushParagraph(){
      if(currentParagraph.length === 0) return;

      const paragraph = document.createElement("div");
      paragraph.className = "ai-paragraph";

      currentParagraph.forEach((line, index) => {
        if(index > 0){
          paragraph.appendChild(document.createElement("br"));
        }
        appendInlineText(paragraph, line);
      });

      container.appendChild(paragraph);
      currentParagraph = [];
    }

    function flushLists(){
      if(currentList){
        container.appendChild(currentList);
        currentList = null;
      }
      if(currentNumberedList){
        container.appendChild(currentNumberedList);
        currentNumberedList = null;
      }
    }

    lines.forEach(rawLine => {

      const line = rawLine.trim();

      if(!line){
        flushParagraph();
        return;
      }

      const bulletMatch = line.match(/^[-*•]\s+(.+)$/);
      if(bulletMatch){
        flushParagraph();
        if(currentNumberedList) flushLists();

        if(!currentList){
          currentList = document.createElement("ul");
          currentList.className = "ai-list";
        }

        const li = document.createElement("li");
        appendInlineText(li, bulletMatch[1]);
        currentList.appendChild(li);
        return;
      }

      const numberedMatch = line.match(/^(\d+)[.)]\s+(.+)$/);
      if(numberedMatch){
        flushParagraph();
        if(currentList) flushLists();

        if(!currentNumberedList){
          currentNumberedList = document.createElement("ol");
          currentNumberedList.className = "ai-numbered-list";
        }

        const li = document.createElement("li");
        const num = parseInt(numberedMatch[1], 10);
        if(!isNaN(num)) li.value = num;
        appendInlineText(li, numberedMatch[2]);
        currentNumberedList.appendChild(li);
        return;
      }

      flushLists();
      currentParagraph.push(line);
    });

    flushParagraph();
    flushLists();
  });

  return container;
}

modalDownload.addEventListener("click", async () => {

fileInput.addEventListener("change", async event => {

    previewWrap.classList.add("show");
  }catch(error){

});




function resizeImage(file, maxSize, quality){

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = event => {

      const img = new Image();

      img.onload = () => {

        let width = img.width;
        let height = img.height;

        if(width > maxSize || height > maxSize){
          const scale = Math.min(maxSize / width, maxSize / height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        resolve(canvas.toDataURL("image/jpeg", quality));
      };

      img.onerror = reject;
      img.src = event.target.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}




function autoResize(){
  messageInput.style.height = "auto";
  const height = Math.min(messageInput.scrollHeight, 130);
  messageInput.style.height = `${height}px`;

async function generateImage(prompt){

  const response = await fetch(IMAGE_API_URL, {
    method:"POST",
    headers:{ "Content-Type": "application/json" },
    body: JSON.stringify({ prompt })
  });

  const text = await response.text();
  let data;

  try{ data = JSON.parse(text); }
  catch{ data = null; }

  if(!response.ok){
    const errorMessage =
      data?.error || data?.message || text || `HTTP ${response.status}`;
    throw new Error(errorMessage);
  }

  let imageUrl = null;

  if(typeof data === "string"){
    imageUrl = data;
  }else if(data){
    imageUrl = data.image || data.image_url || data.url || data.result;

    if(data.result && typeof data.result === "object"){
      imageUrl =
        data.result.image ||
        data.result.image_url ||
        data.result.url ||
        data.result.b64_json ||
        imageUrl;
    }
  }

  if(
    imageUrl &&
    !imageUrl.startsWith("data:") &&
    !imageUrl.startsWith("http") &&
    imageUrl.length > 100
  ){
    imageUrl = "data:image/png;base64," + imageUrl;
  }

  if(!imageUrl){
    throw new Error("Worker tidak mengembalikan gambar.");
  }

  return imageUrl;
}




function stripOldImages(){
  messages.forEach(m => {
    if(Array.isArray(m.content)){
      const t = m.content.find(p => p.type === "text")?.text || "";
      m.content = t + " [gambar sudah dikirim sebelumnya]";
    }
  });
}



async function sendMessage(){

  if(isGenerating) return;

  const text = messageInput.value.trim();

  if(!text && !selectedImageData) return;

  removeWelcome();

  isGenerating = true;
  sendBtn.disabled = true;

  

  if(currentMode === "image"){

    if(!text){
      isGenerating = false;
      sendBtn.disabled = false;
      return;
    }

    appendMessage("user", text);
    messageInput.value = "";
    autoResize();
    showTyping();

    try{
      const imageUrl = await generateImage(text);
      hideTyping();
      appendGeneratedImageMessage(imageUrl, text);
    }catch(error){
      hideTyping();
      appendMessage("ai", getCustomErrorMessage(error, "image"));
      console.error("Image generation error:", error);
    }

    isGenerating = false;
    sendBtn.disabled = false;
    return;
  }


  

  let userContent;

  if(selectedImageData){
    userContent = [
      {
        type:"text",
        text: text || "Analisis gambar ini dengan teliti. Jelaskan apa yang terlihat."
      },
      {
        type:"image_url",
        image_url:{ url: selectedImageData }
      }
    ];
  }else{
    userContent = text;
  }

  appendMessage("user", text || "📷 Mengirim gambar...");

  stripOldImages();
  messages.push({ role:"user", content:userContent });

  messageInput.value = "";
  autoResize();

  selectedImageData = null;
  selectedImageFile = null;
  previewImage.src = "";
  previewWrap.classList.remove("show");
  fileInput.value = "";

  showTyping();

  try{
    const response = await fetch(API_URL, {
      method:"POST",
      headers:{ "Content-Type": "application/json" },
      body: JSON.stringify({
        model: MODEL,
        messages: [messages[0], ...messages.slice(1).slice(-10)],
        max_tokens: MAX_TOKENS,
        temperature: 0.75
      })
    });

    const rawText = await response.text();
    let data;

    try{ data = JSON.parse(rawText); }
    catch{ data = null; }

    if(!response.ok){
      const errorMessage =
        data?.error?.message ||
        data?.error ||
        data?.message ||
        rawText ||
        `HTTP ${response.status}`;
      throw new Error(errorMessage);
    }

    const reply = data?.choices?.[0]?.message?.content;

    if(!reply){
      throw new Error("AI tidak mengembalikan jawaban.");
    }

    const cleanReply = cleanAIResponse(reply);

    hideTyping();

    const row = document.createElement("div");
    row.className = "message-row ai";

    const bubble = document.createElement("div");
    bubble.className = "message ai";

    row.appendChild(bubble);
    chat.appendChild(row);

    bubble.appendChild(renderAIResponse(cleanReply));
    scrollToBottom();

    messages.push({ role:"assistant", content: cleanReply });

  }catch(error){
    hideTyping();

   
    if(messages[messages.length - 1]?.role === "user"){
      messages.pop();
    }

    console.error("Zevora error:", error);

    if(Array.isArray(userContent)){
      appendMessage("ai", ERROR_MESSAGES.vision);
    }else{
      appendMessage("ai", getCustomErrorMessage(error, "chat"));
    }
  }

  isGenerating = false;
  sendBtn.disabled = false;
}
