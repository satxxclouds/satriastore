<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: #ffffff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #1f2937;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    text-align: center;
    max-width: 600px;
  }

  .icon {
    font-size: 72px;
    margin-bottom: 32px;
    opacity: 0.8;
  }

  h1 {
    font-family: 'Merriweather', serif;
    font-size: 42px;
    font-weight: 300;
    color: #111827;
    letter-spacing: -1px;
    line-height: 1.2;
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 15px;
    color: #6b7280;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="icon">🔧</div>
  <h1>Server Sedang<br>Maintenance</h1>
  <p class="subtitle">Kami akan kembali segera</p>
</div>

</body>
</html>
